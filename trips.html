<link rel="stylesheet" href="common.css?v=18">
<style>
.trip-card{display:block;border-radius:var(--radius);overflow:hidden;background:var(--card);box-shadow:var(--shadow);margin-bottom:14px;cursor:pointer;border:0;width:100%;text-align:left;padding:0;color:var(--ink)}
.trip-card .cover{height:150px;background:linear-gradient(135deg,var(--grad-a),var(--grad-b));display:flex;align-items:flex-end;padding:14px 16px;color:#fff;position:relative;overflow:hidden}
.trip-card.past .cover{height:104px}
.trip-card .cover img,.hero-trip img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.trip-card .cover img.ok,.hero-trip img.bg.ok{opacity:1}
.trip-card .cover.ph:after,.hero-trip.ph:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.12) 0,rgba(0,0,0,0) 30%,rgba(0,0,0,.35) 55%,rgba(0,0,0,.78))}
.hero-trip.ph .sub{text-shadow:0 1px 6px rgba(0,0,0,.45);opacity:1}
.ideas{background:linear-gradient(160deg,color-mix(in srgb,var(--accent-soft) 55%,var(--card)),var(--card));box-shadow:inset 0 0 0 1px var(--line)}
.ideas .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.ideas .hd h2{font-size:19px}
.ichips{display:flex;flex-wrap:wrap;gap:8px}
.ichip{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--accent-soft);color:var(--ink);border-radius:99px;padding:7px 14px 7px 7px;font-weight:600;font-size:15px;cursor:pointer;max-width:100%;text-align:left}
.ichip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ichip i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none}
.ichip i .ic{width:15px;height:15px}
.ichip:active{transform:scale(.97)}
.ichip.add{background:none;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--muted);padding:7px 14px}
.ia{background:var(--blue-s);color:var(--blue)}.ib{background:var(--warm);color:var(--warm-ink)}.ic3{background:var(--rose);color:var(--rose-ink)}.id{background:var(--card);color:var(--accent)}.ie{background:var(--violet-s);color:var(--violet)}
.ideas .hint{color:var(--muted);font-size:13px;margin-top:12px}
.dstrip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 6px;margin:12px -2px 0;scrollbar-width:none}
.dstrip::-webkit-scrollbar{display:none}
.dstrip button{flex:none;min-width:58px;border:0;border-radius:14px;background:var(--bg);color:var(--muted);padding:9px 6px;font-size:12px;cursor:pointer;text-align:center}
.dstrip button b{display:block;font-size:19px;color:var(--ink);font-family:Lora,serif;font-weight:600;margin-top:1px}
.dstrip button.on{background:var(--sel-bg);color:var(--sel-ink)}.dstrip button.on b{color:var(--sel-ink)}
.trip-card .cover h2,.trip-card .cover .bdg{position:relative;z-index:1}
.trip-card .cover h2{font-size:25px;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.trip-card .cover .bdg{position:absolute;right:12px;top:12px;background:rgba(255,255,255,.9);color:#1f2b24;border-radius:99px;padding:4px 10px;font-size:12.5px;font-weight:700}
.trip-card .info{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;gap:10px}
.hero-trip{border-radius:var(--radius);background:linear-gradient(135deg,var(--grad-a),var(--grad-b));color:#fff;padding:18px;margin-bottom:14px;position:relative;overflow:hidden;min-height:120px;display:flex;flex-direction:column;justify-content:flex-end}
.hero-trip.ph{min-height:230px}
.hero-trip>*{position:relative;z-index:1}
.hero-trip h1{font-size:30px;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.hero-trip .sub{opacity:.92;margin-top:4px}
.hero-trip .cv{position:absolute;right:12px;top:12px;z-index:2;border:0;background:rgba(0,0,0,.35);color:#fff;border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;gap:6px;align-items:center}
.hero-trip .cv .ic{width:15px;height:15px}
.sug{background:var(--card);border-radius:14px;box-shadow:var(--shadow),inset 0 0 0 1px var(--line);margin-top:6px;padding:2px 12px}
.sug button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:8px 0;border-top:1px solid var(--line);text-align:left;cursor:pointer;color:var(--ink)}
.sug button:first-child{border-top:0}
.sug img,.sug i{width:40px;height:40px;border-radius:10px;object-fit:cover;background:var(--accent-soft);flex:none}
.sug b{display:block;font-size:15px}.sug small{color:var(--muted);font-size:12.5px}
.cprev{height:120px;border-radius:16px;margin-top:8px;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--grad-a),var(--grad-b))}
.cprev img{width:100%;height:100%;object-fit:cover}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cgrid button{aspect-ratio:1;border:0;padding:0;border-radius:12px;overflow:hidden;background:var(--accent-soft);cursor:pointer;position:relative}
.cgrid button.on{box-shadow:0 0 0 3px var(--accent)}
.cgrid img{width:100%;height:100%;object-fit:cover;display:block}
.lbl3{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin:16px 2px 8px}
.dayhead{font-family:Lora,serif;font-weight:600;font-size:17px;margin:4px 0 2px}
.dayblock+.dayblock{border-top:1px solid var(--line);margin-top:10px;padding-top:12px}
.pl{display:flex;gap:12px;padding:8px 0;align-items:flex-start}
.pl .tm{min-width:46px;font-weight:700;color:var(--accent);font-size:14px;padding-top:1px}
.pl .grow{flex:1;min-width:0;word-break:break-word}
.sum{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sum b{font-family:Lora,serif;font-size:26px;font-weight:600}
.amt{font-weight:700;white-space:nowrap}
.grp{font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 2px;text-transform:uppercase;letter-spacing:.04em}
.grp:first-child{margin-top:0}
details summary{cursor:pointer;color:var(--muted);font-size:14px;padding:6px 2px;list-style:none}
details summary::-webkit-details-marker{display:none}
</style>
</head>
<body>
<div id="loading" class="spinner"><img src="icons/icon-192.png" alt=""></div>
<main id="page" class="wrap sub hidden">
  <!-- List of trips -->
  <div id="listView">
    <div class="topbar">
      <button class="icon-btn" id="backBtn" aria-label="back"><svg class="ic"><use href="#i-left"/></svg></button>
      <h1 data-t="trTitle"></h1>
      <button class="add-btn" id="newTrip" aria-label="+"><svg class="ic"><use href="#i-plus"/></svg></button>
    </div>
    <div id="tripList"></div>
    <details id="pastWrap" class="hidden"><summary id="pastSum"></summary><div id="pastList" style="margin-top:8px"></div></details>
  </div>

  <!-- One trip -->
  <div id="tripView" class="hidden">
    <div class="topbar">
      <button class="icon-btn" id="tripBack" aria-label="back"><svg class="ic"><use href="#i-left"/></svg></button>
      <h1></h1>
      <button class="icon-btn" id="editTrip" aria-label="edit"><svg class="ic"><use href="#i-edit"/></svg></button>
    </div>
    <div class="hero-trip" id="tvHero"><img class="bg" id="tvImg" alt="" onload="this.classList.add('ok')" onerror="this.classList.remove('ok')"><button type="button" class="cv" id="coverBtn"><svg class="ic"><use href="#i-photo"/></svg><span data-t="cvChange"></span></button><h1 id="tvTitle"></h1><div class="sub" id="tvDates"></div></div>
    <div class="seg" style="margin-bottom:14px" id="tabSeg">
      <button data-k="plan" class="on" data-t="kPlan"></button><button data-k="pack" data-t="kPack"></button><button data-k="expense" data-t="kBudget"></button><button data-k="booking" data-t="kBook"></button>
    </div>

    <div id="kv-plan" class="kv">
      <div class="card"><div id="planList"></div><button class="btn ghost" id="addPlan" style="margin-top:12px"><svg class="ic"><use href="#i-plus"/></svg><span data-t="addPlan"></span></button></div>
      <div class="card ideas" id="ideasCard"><div class="hd"><h2 data-t="ideasT"></h2><span class="muted" id="ideasN"></span></div><div class="ichips" id="ideasList"></div><div class="hint" id="ideasHint"></div></div>
    </div>

    <div id="kv-pack" class="kv hidden">
      <div class="card">
        <div class="sum"><span data-t="packed"></span><span class="muted" id="packCount"></span></div>
        <div class="bar"><div id="packBar" style="width:0"></div></div>
      </div>
      <div class="card">
        <div id="packList"></div>
        <form class="add-row" id="packForm"><input id="packIn" data-tp="packPh" autocomplete="off"><button class="add-btn" type="submit" aria-label="+"><svg class="ic"><use href="#i-plus"/></svg></button></form>
        <div class="chips" id="packOwner" style="margin-top:10px"></div>
        <button class="btn link small" id="packTemplate" style="margin-top:8px" data-t="packTemplate"></button>
      </div>
    </div>

    <div id="kv-expense" class="kv hidden">
      <div class="card">
        <div class="sum"><span data-t="spent"></span><b id="spentTotal"></b></div>
        <div class="muted small" id="budgetLine"></div>
        <div class="bar" id="budgetBarWrap"><div id="budgetBar" style="width:0"></div></div>
      </div>
      <div class="card"><div id="expList"></div><button class="btn ghost" id="addExp" style="margin-top:12px"><svg class="ic"><use href="#i-plus"/></svg><span data-t="addExp"></span></button></div>
    </div>

    <div id="kv-booking" class="kv hidden">
      <div class="card"><div id="bookList"></div><button class="btn ghost" id="addBook" style="margin-top:12px"><svg class="ic"><use href="#i-plus"/></svg><span data-t="addBook"></span></button></div>
    </div>
  </div>
</main>

<dialog id="tripSheet"><form class="sheet" method="dialog" id="tripForm">
  <h2 id="tsTitle"></h2>
  <label data-t="where"></label><input id="tTitle" required data-tp="wherePh" autocomplete="off"><div class="sug hidden" id="tSug"></div><div class="cprev hidden" id="tPrev"><img alt=""></div>
  <div class="two"><div><label data-t="from"></label><button type="button" class="field" data-date id="tStart"></button></div><div><label data-t="to"></label><button type="button" class="field" data-date id="tEnd"></button></div></div>
  <label data-t="budget"></label><input id="tBudget" inputmode="decimal" data-tp="budgetPh">
  <label data-t="note"></label><textarea id="tNote" data-tp="optional" style="min-height:64px"></textarea>
  <div class="actions"><button class="btn ghost" value="cancel" formnovalidate data-t="cancel"></button><button class="btn" value="ok" data-t="save"></button></div>
  <button type="button" class="btn link hidden" id="tDelete" style="margin:12px auto 0;color:#c0564f"><svg class="ic"><use href="#i-trash"/></svg><span data-t="delTrip"></span></button>
</form></dialog>

<dialog id="coverSheet"><form class="sheet" method="dialog">
  <h2 data-t="cvTitle"></h2>
  <div id="cvWikiWrap"><div class="cgrid" id="cvWiki" style="margin-top:12px"></div></div>
  <div class="lbl3" id="cvMomLbl" data-t="cvMoments"></div>
  <div class="cgrid" id="cvMom"></div>
  <div class="k-list" style="margin-top:14px">
    <button type="button" class="btn ghost" id="cvUpload"><svg class="ic"><use href="#i-camera"/></svg><span data-t="cvUpload"></span></button>
    <button type="button" class="btn link" id="cvNone" style="margin:8px auto 0" data-t="cvNone"></button>
  </div>
  <input type="file" id="cvFile" accept="image/*" class="hidden">
</form></dialog>

<dialog id="daySheet"><form class="sheet" method="dialog">
  <h2 id="dsTitle"></h2><p class="muted small" data-t="dsHint" style="margin:4px 0 0"></p>
  <div class="dstrip" id="dsDays"></div>
  <div class="actions"><button type="button" class="btn ghost" id="dsEdit" data-t="edit"></button><button class="btn" value="cancel" data-t="cancel"></button></div>
</form></dialog>

<dialog id="itemSheet"><form class="sheet" method="dialog" id="itemForm">
  <h2 id="isTitle"></h2>
  <label data-t="title"></label><input id="iTitle" required>
  <div id="iDayWrap"><label data-t="iDay"></label><select id="iDay"></select></div>
  <div id="iTimeWrap"><label data-t="iTime"></label><div class="two"><select id="iHour"></select><select id="iMin"></select></div></div>
  <div id="iAmtWrap"><label data-t="iAmount"></label><input id="iAmount" inputmode="decimal" placeholder="0"></div>
  <div id="iDetWrap"><label id="iDetLabel"></label><textarea id="iDetails" style="min-height:64px"></textarea></div>
  <div class="actions"><button class="btn ghost" value="cancel" formnovalidate data-t="cancel"></button><button class="btn" value="ok" data-t="save"></button></div>
  <button type="button" class="btn link hidden" id="iDelete" style="margin:12px auto 0;color:#c0564f"><svg class="ic"><use href="#i-trash"/></svg><span data-t="delete"></span></button>
</form></dialog>

<script async src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="common.js?v=19"></script>
<script>
addT({
ru: { trTitle:'Поездки', trEmpty:'Здесь будут ваши поездки: маршрут по дням, вещи, бюджет и брони. Нажмите +, чтобы начать.', past:n => `Прошлые поездки (${n})`,
  now:'сейчас', noDates:'даты не выбраны', newTrip:'Новая поездка', editTrip:'Поездка', where:'Куда', wherePh:'Стамбул', from:'С', to:'По', budget:'Бюджет', budgetPh:'90 000',
  delTrip:'Удалить поездку', confirmDelTrip:'Удалить поездку со всеми планами и тратами?',
  kPlan:'План', kPack:'Вещи', kBudget:'Бюджет', kBook:'Брони', addPlan:'Добавить в план', addExp:'Добавить трату', addBook:'Добавить бронь',
  planEmpty:'Добавьте, что хотите сделать: места, рестораны, экскурсии.', noDay:'Без даты', dayN:(n,d) => `День ${n} · ${d}`,
  packed:'Собрано', packPh:'Паспорт', packTemplate:'Добавить базовый список вещей', ownShared:'Общее', ownMine:'Моё', packEmpty:'Список вещей пуст',
  packBase:['Паспорт','Билеты','Зарядки','Аптечка','Наличные и карты','Зубные щётки','Пауэрбанк','Солнцезащитный крем','Удобная обувь','Адаптер для розеток'],
  spent:'Потрачено', ofBudget:(b) => `из ${b}`, noBudget:'Бюджет не задан. Укажите его в настройках поездки.', over:n => `Перерасход ${n}`, left:n => `Осталось ${n}`,
  expEmpty:'Пока трат нет', paidBy:n => `оплата: ${n}`, bookEmpty:'Добавьте билеты, отель, аренду машины: номера бронирований будут под рукой.',
  newPlan:'В план', newExp:'Трата', newBook:'Бронь', iDay:'День', iTime:'Время', iAmount:'Сумма', planDet:'Подробности', bookDet:'Номер брони, адрес, ссылка', expDet:'Комментарий',
  noTime:'без времени', confirmDelItem:'Удалить?', cvChange:'Сменить обложку', cvTitle:'Обложка', cvMoments:'Из «Моментов»', cvUpload:'Загрузить своё фото', cvNone:'Без фото, цветной фон', cvNoMom:'В «Моментах» пока нет фото', ideasT:'Идеи на поездку', ideasHint:'Нажмите на идею, чтобы выбрать день', ideasHintNo:'Нажмите на идею, чтобы изменить её', ideaAdd:'идея', dsTitle:x => `«${x}»: в какой день?`, dsHint:'Идея перейдёт в план этого дня', planEmpty2:'Добавьте, что хотите сделать. Без даты это станет идеей, день можно выбрать потом.' },
en: { trTitle:'Trips', trEmpty:'Your trips will live here: a day-by-day plan, packing, budget and bookings. Tap + to start.', past:n => `Past trips (${n})`,
  now:'now', noDates:'no dates yet', newTrip:'New trip', editTrip:'Trip', where:'Where to', wherePh:'Istanbul', from:'From', to:'To', budget:'Budget', budgetPh:'1,000',
  delTrip:'Delete trip', confirmDelTrip:'Delete this trip with all plans and expenses?',
  kPlan:'Plan', kPack:'Packing', kBudget:'Budget', kBook:'Bookings', addPlan:'Add to plan', addExp:'Add expense', addBook:'Add booking',
  planEmpty:'Add what you want to do: places, restaurants, tours.', noDay:'No date', dayN:(n,d) => `Day ${n} · ${d}`,
  packed:'Packed', packPh:'Passport', packTemplate:'Add a basic packing list', ownShared:'Shared', ownMine:'Mine', packEmpty:'Packing list is empty',
  packBase:['Passport','Tickets','Chargers','First aid kit','Cash and cards','Toothbrushes','Power bank','Sunscreen','Comfortable shoes','Plug adapter'],
  spent:'Spent', ofBudget:(b) => `of ${b}`, noBudget:'No budget set. Add one in the trip settings.', over:n => `Over by ${n}`, left:n => `${n} left`,
  expEmpty:'No expenses yet', paidBy:n => `paid by ${n}`, bookEmpty:'Add tickets, hotel, car rental: booking numbers will be at hand.',
  newPlan:'Plan item', newExp:'Expense', newBook:'Booking', iDay:'Day', iTime:'Time', iAmount:'Amount', planDet:'Details', bookDet:'Booking number, address, link', expDet:'Comment',
  noTime:'no time', confirmDelItem:'Delete?', cvChange:'Change cover', cvTitle:'Cover', cvMoments:'From Moments', cvUpload:'Upload a photo', cvNone:'No photo, colour background', cvNoMom:'No photos in Moments yet', ideasT:'Trip ideas', ideasHint:'Tap an idea to pick a day', ideasHintNo:'Tap an idea to edit it', ideaAdd:'idea', dsTitle:x => `“${x}”: which day?`, dsHint:'The idea moves to that day\'s plan', planEmpty2:'Add what you want to do. Without a date it becomes an idea, pick the day later.' }
});
const TR = { ctx:null, trips:[], items:[], open:null, tab:'plan', packOwner:'shared', editingTrip:null, editingItem:null, itemKind:'plan' };
const nameOf = id => id === TR.ctx.user.id ? t('you') : (TR.ctx.partner?.id === id ? TR.ctx.partner.display_name : '');

async function loadTrips(){
  const { data, error } = await sb.from('trips').select('*').order('start_date', { ascending:true, nullsFirst:false });
  if (error) throw error;
  TR.trips = data; await signCovers(); renderList();
  if (TR.open) { const tr = TR.trips.find(x => x.id === TR.open); if (tr) await loadItems(); else closeTrip(); }
}
async function loadItems(){
  const { data } = await sb.from('trip_items').select('*').eq('trip_id', TR.open).order('day', { nullsFirst:false }).order('time', { nullsFirst:true }).order('created_at');
  TR.items = data || []; renderTrip();
}
function tripCard(tr){
  const td = today(); let badge = '';
  if (tr.start_date) {
    const s = parseYmd(tr.start_date), e = parseYmd(tr.end_date || tr.start_date);
    badge = s <= td && e >= td ? `<span class="badge">${t('now')}</span>` : s > td ? `<span class="badge">${untilLabel(s)}</span>` : '';
  }
  const src = coverSrc(tr), past = tr.start_date && parseYmd(tr.end_date || tr.start_date) < td;
  return `<button class="trip-card ${past ? 'past' : ''}" data-trip="${tr.id}"><div class="cover ${src ? 'ph' : ''}">${src ? `<img src="${esc(src)}" alt="" onload="this.classList.add('ok')" onerror="this.remove()">` : ''}<h2>${esc(tripTitle(tr))}</h2>${badge ? `<span class="bdg">${badge.replace(/<[^>]+>/g, '')}</span>` : ''}</div>
    <div class="info"><span class="muted">${tr.start_date ? fmtRange(tr.start_date, tr.end_date) : t('noDates')}</span></div></button>`;
}
function renderList(){
  const td = ymd(today());
  const past = TR.trips.filter(x => (x.end_date || x.start_date) && (x.end_date || x.start_date) < td).reverse();
  const cur = TR.trips.filter(x => !past.includes(x));
  $('tripList').innerHTML = cur.length ? cur.map(tripCard).join('') : (past.length ? '' : `<div class="card empty">${t('trEmpty')}</div>`);
  $('pastWrap').classList.toggle('hidden', !past.length);
  $('pastSum').textContent = t('past', past.length);
  $('pastList').innerHTML = past.map(tripCard).join('');
}
document.addEventListener('click', e => { const id = e.target.closest('[data-trip]')?.dataset.trip; if (id) openTrip(id); });

function openTrip(id){
  TR.open = id; TR.tab = 'plan'; $('listView').classList.add('hidden'); $('tripView').classList.remove('hidden');
  window.scrollTo(0,0); try { history.pushState({ trip:id }, '', '#trip=' + id); } catch(_){}
  renderTrip(); loadItems();
}
function closeTrip(){ TR.open = null; $('tripView').classList.add('hidden'); $('listView').classList.remove('hidden'); window.scrollTo(0,0); }
window.addEventListener('popstate', () => { if (TR.open) closeTrip(); });
$('tripBack').onclick = () => { if (history.state?.trip) history.back(); else closeTrip(); };
function tripDays(tr){
  if (!tr?.start_date) return [];
  const out = [], s = parseYmd(tr.start_date), e = parseYmd(tr.end_date || tr.start_date);
  for (let d = s, i = 0; d <= e && i < 60; d = addDays(d, 1), i++) out.push(ymd(d));
  return out;
}

function renderTrip(){
  const tr = TR.trips.find(x => x.id === TR.open); if (!tr) return;
  $('tvTitle').textContent = tripTitle(tr);
  const src = coverSrc(tr); $('tvHero').classList.toggle('ph', !!src);

// ===== Covers: city photos from Wikipedia (Wikidata finds the place in Russian or English) =====
const WIKI = {
  lang: q => /[а-яё]/i.test(q) ? 'ru' : 'en',
  get: u => fetch(u).then(r => r.ok ? r.json() : null).catch(() => null),
  file: (f, w) => `https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(String(f).replace(/^File:/, '').replace(/ /g, '_'))}?width=${w}`,
  bad: /collage|montage|coat|flag|map|logo|emblem|seal|locator|location|karte|wappen|signature|diagram|chart|plan_of|scheme|lccn|sentinel|satellite|portrait|19[0-6]\ds|18\d\ds|\d{4}s\b|stamp|banknote|press_conference/i,
  async search(q){
    q = q.trim(); if (q.length < 2) return [];
    const l = WIKI.lang(q);
    const r = await WIKI.get(`https://www.wikidata.org/w/api.php?action=wbsearchentities&format=json&origin=*&type=item&limit=6&language=${l}&uselang=${LANG}&search=${encodeURIComponent(q)}`);
    if (!r) return null; // offline or blocked: try again later
    const list = r.search || []; if (!list.length) return [];
    const e = (await WIKI.get(`https://www.wikidata.org/w/api.php?action=wbgetentities&format=json&origin=*&props=claims|sitelinks|labels|descriptions&languages=ru|en&sitefilter=enwiki|ruwiki&ids=${list.map(x => x.id).join('|')}`)) || {};
    return list.map(x => { const en = e.entities?.[x.id] || {};
      return { id:x.id, label: en.labels?.[LANG]?.value || en.labels?.ru?.value || en.labels?.en?.value || x.label, desc: en.descriptions?.[LANG]?.value || x.description || '',
        img: en.claims?.P18?.[0]?.mainsnak?.datavalue?.value, geo: !!en.claims?.P625, en: en.sitelinks?.enwiki?.title, ru: en.sitelinks?.ruwiki?.title }; })
      .filter(x => x.geo && (x.en || x.ru)).slice(0, 4);
  },
  async photos(p){
    for (const [l, title] of [['en', p.en], ['ru', p.ru]]) {
      if (!title) continue;
      const r = (await WIKI.get(`https://${l}.wikipedia.org/api/rest_v1/page/media-list/${encodeURIComponent(title.replace(/ /g, '_'))}`)) || {};
      const files = (r.items || []).filter(i => i.type === 'image' && /\.jpe?g$/i.test(i.title) && !WIKI.bad.test(i.title)).map(i => i.title.replace(/^File:/, ''));
      if (files.length) return [...new Set(files)].slice(0, 6);
    }
    return p.img && /\.jpe?g$/i.test(p.img) && !WIKI.bad.test(p.img) ? [p.img] : [];
  }
};
TR.urls = {};
const placeRow = (p, photos) => photos?.length ? { place_qid:p.id, place_name:p.label, cover_kind:'wiki', cover_url:WIKI.file(photos[0], 1200), cover_alts:photos }
  : { place_qid:p.id, place_name:p.label, cover_kind:'none', cover_url:null, cover_alts:[] };
function coverSrc(tr){
  if (tr.cover_kind === 'wiki') return tr.cover_url;
  if ((tr.cover_kind === 'moment' || tr.cover_kind === 'upload') && tr.cover_path) return TR.urls[tr.cover_path] || null;
  return null;
}
// the place name in the app's language when the trip title is just the place
const tripTitle = tr => tr.place_name && tr.title && tr.title.trim().toLowerCase() !== tr.place_name.toLowerCase() && WIKI.lang(tr.title) !== WIKI.lang(tr.place_name) && WIKI.lang(tr.place_name) === (LANG === 'ru' ? 'ru' : 'en') ? tr.place_name : tr.title;
async function signCovers(){
  const need = TR.trips.filter(x => x.cover_path && !TR.urls[x.cover_path]).map(x => x.cover_path);
  if (!need.length) return;
  const { data } = await sb.storage.from('moments').createSignedUrls(need, 3600);
  (data || []).forEach(u => { if (u.signedUrl) TR.urls[u.path] = u.signedUrl; });
}
// trips without a cover look their place up once, then the result is saved for both partners
let autoBusy = false;
async function autoCovers(){

    for (const tr of TR.trips.filter(x => !x.cover_kind && x.title)) {
      const found = await WIKI.search(tr.title); if (found === null) break; // no connection: don't mark as 'no photo'
      const p = found[0];

    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k); c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);

  const tr = TR.trips.find(x => x.id === TR.open), days = tripDays(tr);
  $('isTitle').textContent = { plan:t('newPlan'), expense:t('newExp'), booking:t('newBook') }[kind];
  $('iTitle').value = row?.title || ''; $('iDetails').value = row?.details || ''; $('iAmount').value = row?.amount ?? '';
  $('iDay').innerHTML = `<option value="">${t('noDay')}</option>` + days.map((d, i) => `<option value="${d}">${kind === 'plan' ? t('dayN', i + 1, fmtDay(parseYmd(d))) : fmtDay(parseYmd(d))}</option>`).join('');
  $('iDay').value = row?.day || (kind === 'expense' && days.includes(ymd(today())) ? ymd(today()) : '');
  const [h, m] = (row?.time || '').split(':'); fillTime(h || '', m || '00');
  $('iDayWrap').classList.toggle('hidden', !days.length);
  $('iTimeWrap').classList.toggle('hidden', kind === 'expense');
  $('iAmtWrap').classList.toggle('hidden', kind === 'plan');
  $('iDetLabel').textContent = { plan:t('planDet'), expense:t('expDet'), booking:t('bookDet') }[kind];
  $('iDelete').classList.toggle('hidden', !row);
  $('itemSheet').showModal();
}
$('addPlan').onclick = () => openItem('plan'); $('addExp').onclick = () => openItem('expense'); $('addBook').onclick = () => openItem('booking');
$('itemSheet').onclose = async () => {
  if ($('itemSheet').returnValue !== 'ok') return;
  const amt = $('iAmount').value.replace(/[^\d.,]/g, '').replace(',', '.');
  const row = { title:$('iTitle').value.trim(), day:$('iDay').value || null, time:$('iHour').value ? `${$('iHour').value}:${$('iMin').value}` : null,
    amount:TR.itemKind === 'plan' || !amt ? null : Number(amt), details:$('iDetails').value.trim() || null };
  if (TR.itemKind === 'expense') row.time = null;
  const q = TR.editingItem ? sb.from('trip_items').update(row).eq('id', TR.editingItem.id)
    : sb.from('trip_items').insert({ ...row, kind:TR.itemKind, trip_id:TR.open, couple_id:TR.ctx.couple.id });
  const { error } = await q; if (error) alert(errText(error));
  loadItems();
};
$('iDelete').onclick = async () => {
  if (!TR.editingItem || !confirm(t('confirmDelItem'))) return;
  $('itemSheet').close('cancel'); await sb.from('trip_items').delete().eq('id', TR.editingItem.id); loadItems();
};

// ===== Start =====
(async () => {
  applyI18n();
  const go = () => { const dl = [...document.querySelectorAll('dialog[open]')]; if (dl.length) { dl[dl.length - 1].close('cancel'); return; } if (TR.open) { if (history.state?.trip) history.back(); else closeTrip(); } else location.href = 'index.html#sections'; };
  $('backBtn').onclick = go;
  const a = tgApp(); if (inTG && a?.BackButton) { try { a.BackButton.show(); a.BackButton.onClick(go); } catch(_){} }
  TR.ctx = await requireCouple();
  applyI18n();
  await loadTrips();
  const m = location.hash.match(/trip=([0-9a-f-]{36})/); if (m && TR.trips.some(x => x.id === m[1])) { TR.open = m[1]; $('listView').classList.add('hidden'); $('tripView').classList.remove('hidden'); loadItems(); }
  show('page', ['loading','page']);
  autoCovers();
  sb.channel('trips-' + TR.ctx.couple.id)
    .on('postgres_changes', { event:'*', schema:'public', table:'trips', filter:`couple_id=eq.${TR.ctx.couple.id}` }, () => loadTrips())
    .on('postgres_changes', { event:'*', schema:'public', table:'trip_items', filter:`couple_id=eq.${TR.ctx.couple.id}` }, () => { if (TR.open) loadItems(); })
    .subscribe();
})().catch(e => { console.error(e); alert(t('loadErr') + errText(e)); });
langHooks.push(() => { if (TR.ctx) { renderList(); renderTrip(); } });
</script>

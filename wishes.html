<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duo · Желания</title>
<meta name="theme-color" content="#eef3ee">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>(function(){try{var p=localStorage.getItem('duo.theme')||'auto';document.documentElement.dataset.theme=(p==='dark'||(p==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches))?'dark':'light';var c=localStorage.getItem('duo.palette');if(c&&c!=='sage')document.documentElement.dataset.palette=c;}catch(e){}})();</script>
<link rel="stylesheet" href="common.css?v=19">
<style>
.wish{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line);align-items:flex-start}
.wish:first-child{border-top:0;padding-top:4px}
.wish .grow{flex:1;min-width:0}
.wish .t{font-weight:600;word-break:break-word}
.wish .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.wish .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.price{font-weight:700;color:var(--accent);white-space:nowrap}
.reserved{border-radius:14px;background:var(--warm);color:var(--warm-ink);padding:8px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
details summary{cursor:pointer;color:var(--muted);font-size:14px;padding:6px 2px;list-style:none}
details summary::-webkit-details-marker{display:none}
</style>
</head>
<body>
<div id="loading" class="spinner"><img src="icons/icon-192.png" alt=""></div>
<main id="page" class="wrap sub hidden">
  <div class="topbar">
    <button class="icon-btn" data-back aria-label="back"><svg class="ic"><use href="#i-left"/></svg></button>
    <h1 data-t="wTitle"></h1>
    <button class="add-btn" id="addBtn" aria-label="+"><svg class="ic"><use href="#i-plus"/></svg></button>
  </div>
  <div class="seg" style="margin-bottom:14px" id="whoSeg"><button data-who="me" class="on" data-t="wMine"></button><button data-who="partner" id="partnerTabBtn"></button></div>
  <p class="muted small" id="hint" style="margin:-4px 4px 12px"></p>
  <div class="card" id="listCard"><div id="list"></div></div>
  <details id="doneWrap" class="hidden"><summary id="doneSum"></summary><div class="card" style="margin-top:8px"><div id="doneList"></div></div></details>
</main>

<dialog id="wishSheet"><form class="sheet" method="dialog" id="wishForm">
  <h2 id="wsTitle"></h2>
  <label data-t="wWhat"></label><input id="wTitleIn" required data-tp="wWhatPh">
  <label data-t="wLink"></label><input id="wUrl" type="url" inputmode="url" autocapitalize="none" placeholder="https://">
  <label data-t="wPrice"></label><input id="wPrice" inputmode="decimal" data-tp="wPricePh">
  <label data-t="wKind"></label><div class="chips" id="wKind"></div>
  <label data-t="wPriority"></label><div class="chips" id="wPrio"></div>
  <label data-t="note"></label><textarea id="wNote" data-tp="optional" style="min-height:70px"></textarea>
  <label class="toggle hidden" id="wRecWrap"><input type="checkbox" id="wReceived"><span data-t="wReceived"></span></label>
  <div class="actions"><button class="btn ghost" value="cancel" formnovalidate data-t="cancel"></button><button class="btn" value="ok" data-t="save"></button></div>
  <button type="button" class="btn link hidden" id="wDelete" style="margin:12px auto 0;color:#c0564f"><svg class="ic"><use href="#i-trash"/></svg><span data-t="delete"></span></button>
</form></dialog>

<dialog id="giftSheet"><form class="sheet" method="dialog" id="giftForm">
  <h2 data-t="gTitle"></h2>
  <div style="font-weight:700;font-size:17px;margin-top:2px" id="gWish"></div>
  <p class="muted small" id="gHint" style="margin:2px 0 4px"></p>
  <label data-t="gWhen"></label><div class="chips" id="gWhen"></div>
  <div id="gDateWrap" class="hidden" style="margin-top:10px"><button type="button" class="field" data-date id="gDate"></button></div>
  <div id="gRemWrap"><label data-t="gRemind"></label><div class="chips" id="gRem"></div>
  <p class="muted small" style="margin:12px 0 0;display:flex;gap:8px;align-items:center"><svg class="ic" style="width:16px;height:16px"><use href="#i-lock"/></svg><span data-t="gPrivate"></span></p></div>
  <div class="actions"><button class="btn ghost" value="cancel" formnovalidate data-t="cancel"></button><button class="btn" value="ok" id="gGo"></button></div>
</form></dialog>

<script async src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="common.js?v=19"></script>
<script>
addT({
ru: { wTitle:'Желания', wMine:'Мои', wPartners:n => `${n}`, wAddFirst:'Добавьте то, что хотели бы получить в подарок: вещь или впечатление.',
  wPartnerEmpty:n => `${n}: пока пусто`, wNoPartner:'Партнёр ещё не присоединился к паре',
  wHintMine:'Партнёр видит ваш список, но вы не видите, что он собирается подарить.', wHintPartner:n => `Нажмите «Я подарю», чтобы забронировать. ${n} этого не увидит.`,
  wNew:'Новое желание', wEdit:'Желание', wWhat:'Что хочется', wWhatPh:'Фотоаппарат Instax', wLink:'Ссылка', wPrice:'Цена', wPricePh:'9 000 ₽',
  wKind:'Что это', wThing:'Вещь', wExp:'Впечатление', wPriority:'Насколько хочется', wWant:'Хочу', wReally:'Очень хочу', wReceived:'Уже подарили',
  wReserve:'Я подарю', wYouGift:'Вы дарите', wUnreserve:'Отменить', wTaken:'Уже кто-то дарит', wOpen:'Открыть ссылку', wDone:n => `Сбылось (${n})`,
  wConfirmDel:'Удалить это желание?', gTitle:'Вы подарите', gHidden:n => `${n} не узнает, что вы это забронировали`, gWhen:'Когда подарить', gRemind:'Напомнить',
  gNoDate:'Пока без даты', gOther:'Другая дата', gNY:'Новый год', gPrivate:'В календаре будет видно только вам', gGo:'Забронировать', gGoPlan:'Запланировать',
  gEvent:t => `Подарок: ${t}`, gRem:[['day','За день'],['week','За неделю']], gAnniv:y => `${y} ${plural(y,'год','года','лет')} вместе`, gOn:d => `· ${d}` },
en: { wTitle:'Wishes', wMine:'Mine', wPartners:n => `${n}`, wAddFirst:'Add things you\'d love to get as a gift: an item or an experience.',
  wPartnerEmpty:n => `${n} hasn't added anything yet`, wNoPartner:'Your partner hasn\'t joined yet',
  wHintMine:'Your partner sees your list, but you can\'t see what they plan to give you.', wHintPartner:n => `Tap “I'll give this” to reserve it. ${n} won't see it.`,
  wNew:'New wish', wEdit:'Wish', wWhat:'What would you like', wWhatPh:'Instax camera', wLink:'Link', wPrice:'Price', wPricePh:'$90',
  wKind:'What is it', wThing:'Item', wExp:'Experience', wPriority:'How much', wWant:'Want', wReally:'Really want', wReceived:'Already received',
  wReserve:'I\'ll give this', wYouGift:'You\'re giving this', wUnreserve:'Cancel', wTaken:'Someone is giving this', wOpen:'Open link', wDone:n => `Came true (${n})`,
  wConfirmDel:'Delete this wish?', gTitle:'You\'ll give', gHidden:n => `${n} won't know you reserved it`, gWhen:'When to give it', gRemind:'Remind me',
  gNoDate:'No date yet', gOther:'Other date', gNY:'New Year', gPrivate:'Only you will see it in the calendar', gGo:'Reserve', gGoPlan:'Reserve and plan',
  gEvent:t => `Gift: ${t}`, gRem:[['day','A day before'],['week','A week before']], gAnniv:y => `${y} ${y === 1 ? 'year' : 'years'} together`, gOn:d => `· ${d}` }
});
const P = { ctx:null, who:'me', wishes:[], res:[], events:[], dates:[], editing:null };
const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch(_) { return ''; } };

async function load(){
  const [w, r, ev, dt] = await Promise.all([
    sb.from('wishes').select('*').order('priority', { ascending:false }).order('created_at', { ascending:false }),
    sb.from('wish_reservations').select('*'),
    sb.from('events').select('id,title,kind,repeat,starts_at,private_to'),
    sb.from('important_dates').select('title,date,repeats_yearly')
  ]);
  if (w.error) throw w.error;
  P.wishes = w.data; P.res = r.data || []; P.events = ev.data || []; P.dates = dt.data || [];
  render();
}
function wishRow(w, mine){
  const res = P.res.find(r => r.wish_id === w.id), byMe = res && res.reserved_by === P.ctx.user.id;
  const meta = [
    w.price ? `<span class="price">${esc(w.price)}</span>` : '',
    w.priority === 2 ? `<span class="badge">${t('wReally')}</span>` : '',
    w.kind === 'experience' ? `<span class="badge warm">${t('wExp')}</span>` : '',
    w.url ? `<span class="muted small">${esc(hostOf(w.url))}</span>` : ''
  ].join('');
  let acts = '';
  if (w.url) acts += `<button class="btn ghost sm" data-open="${w.id}">${icon('link')}<span>${t('wOpen')}</span></button>`;
  if (!mine && !w.received) {
    const gev = byMe && res.event_id && P.events.find(e => e.id === res.event_id);
    if (byMe) acts += `<span class="reserved">${icon('gift')}${t('wYouGift')}${gev ? ' ' + t('gOn', fmtDay(new Date(gev.starts_at))) : ''}</span><button class="btn link sm" data-unres="${w.id}">${t('wUnreserve')}</button>`;
    else acts += `<button class="btn warm sm" data-res="${w.id}">${icon('gift')}<span>${t('wReserve')}</span></button>`;
  }
  return `<div class="wish" ${mine ? `data-edit="${w.id}" style="cursor:pointer"` : ''}>
    <div class="bubble">${icon(w.kind === 'experience' ? 'sparkle' : 'gift')}</div>
    <div class="grow"><div class="t">${esc(w.title)}</div>${meta ? `<div class="meta">${meta}</div>` : ''}
      ${w.note ? `<div class="muted small" style="margin-top:6px">${esc(w.note)}</div>` : ''}
      ${acts ? `<div class="acts">${acts}</div>` : ''}</div>
    ${mine ? `<span class="muted">${icon('edit')}</span>` : ''}</div>`;
}
function render(){
  const me = P.ctx.user.id, partner = P.ctx.partner, pName = partner?.display_name || t('partner');
  $('partnerTabBtn').textContent = pName;
  document.querySelectorAll('#whoSeg button').forEach(b => b.classList.toggle('on', b.dataset.who === P.who));
  $('addBtn').classList.toggle('hidden', P.who !== 'me');
  const mine = P.who === 'me';
  const all = P.wishes.filter(w => mine ? w.owner_id === me : w.owner_id !== me);
  const open = all.filter(w => !w.received), done = all.filter(w => w.received);
  $('hint').textContent = mine ? t('wHintMine') : (partner ? t('wHintPartner', pName) : '');
  $('list').innerHTML = open.length ? open.map(w => wishRow(w, mine)).join('')
    : `<div class="empty">${mine ? t('wAddFirst') : partner ? t('wPartnerEmpty', pName) : t('wNoPartner')}</div>`;
  $('doneWrap').classList.toggle('hidden', !done.length);
  $('doneSum').textContent = t('wDone', done.length);
  $('doneList').innerHTML = done.map(w => wishRow(w, mine)).join('');
}
document.querySelectorAll('#whoSeg button').forEach(b => b.onclick = () => { P.who = b.dataset.who; render(); });
document.addEventListener('click', async e => {
  const o = e.target.closest('[data-open]')?.dataset.open;
  if (o) { e.stopPropagation(); const w = P.wishes.find(x => x.id === o); if (w?.url) openLink(w.url); return; }
  const r = e.target.closest('[data-res]')?.dataset.res;
  if (r) return openGift(P.wishes.find(x => x.id === r));
  const u = e.target.closest('[data-unres]')?.dataset.unres;
  if (u) {
    const res = P.res.find(x => x.wish_id === u);
    await sb.from('wish_reservations').delete().eq('wish_id', u);
    if (res?.event_id) await sb.from('events').delete().eq('id', res.event_id).eq('private_to', P.ctx.user.id);
    return load();
  }
  const ed = e.target.closest('[data-edit]')?.dataset.edit;
  if (ed && !e.target.closest('button')) openSheet(P.wishes.find(x => x.id === ed));
});

// ===== Gift: reserve + plan a private reminder =====
let getWhen, getRem, giftWish;
function occasions(){
  const td = today(), out = [], nextOf = (m, d) => { let n = new Date(td.getFullYear(), m, d); if (n < td) n = new Date(td.getFullYear() + 1, m, d); return n; };
  const st = P.ctx.couple.start_date;
  if (st) { const s0 = parseYmd(st), n = nextOf(s0.getMonth(), s0.getDate()), y = n.getFullYear() - s0.getFullYear(); if (y > 0) out.push([t('gAnniv', y), n]); }
  for (const e of P.events.filter(e => (e.kind === 'birthday' || e.kind === 'anniversary') && e.repeat === 'yearly')) { const d = new Date(e.starts_at); out.push([e.title, nextOf(d.getMonth(), d.getDate())]); }
  for (const x of P.dates) { const d = parseYmd(x.date); const n = x.repeats_yearly ? nextOf(d.getMonth(), d.getDate()) : d; if (n >= td) out.push([x.title, n]); }
  out.push([t('gNY'), nextOf(11, 31)]);
  return out.sort((a, b) => a[1] - b[1]).slice(0, 5);
}
function openGift(w){
  giftWish = w; P.occ = occasions();
  $('gWish').textContent = w.title; $('gHint').textContent = t('gHidden', P.ctx.partner?.display_name || t('partner'));
  const opts = [...P.occ.map(([title, d], i) => [String(i), `${title} · ${d.getDate()} ${t('monthsShort')[d.getMonth()]}`]), ['other', t('gOther')], ['none', t('gNoDate')]];
  getWhen = chipPicker($('gWhen'), opts, P.occ.length ? '0' : 'none');
  getRem = chipPicker($('gRem'), t('gRem'), 'week');
  setDate($('gDate'), '');
  const sync = () => { const v = getWhen(); $('gDateWrap').classList.toggle('hidden', v !== 'other'); $('gRemWrap').classList.toggle('hidden', v === 'none'); $('gGo').textContent = v === 'none' ? t('gGo') : t('gGoPlan'); };
  const orig = $('gWhen').onclick; $('gWhen').onclick = ev => { orig(ev); sync(); }; sync();
  $('giftSheet').showModal();
}
$('giftSheet').onclose = async () => {
  if ($('giftSheet').returnValue !== 'ok' || !giftWish) return;
  const v = getWhen(); let when = null;
  if (v === 'other') when = getDate($('gDate')) ? parseYmd(getDate($('gDate'))) : null;
  else if (v !== 'none') when = P.occ[+v]?.[1] || null;
  const { error } = await sb.from('wish_reservations').insert({ wish_id:giftWish.id, couple_id:P.ctx.couple.id });
  if (error) { alert(errText(error)); return load(); }
  if (when) {
    const d = new Date(when); d.setHours(12, 0, 0, 0);
    const { data: ev, error: e2 } = await sb.from('events').insert({ couple_id:P.ctx.couple.id, title:t('gEvent', giftWish.title), starts_at:d.toISOString(), all_day:true,
      kind:'reminder', repeat:'none', remind:getRem(), private_to:P.ctx.user.id }).select().single();
    if (!e2 && ev) await sb.from('wish_reservations').update({ event_id:ev.id }).eq('wish_id', giftWish.id);
  }
  load();
};

// ===== Add / edit =====
let getKind, getPrio;
function openSheet(w){
  P.editing = w || null;
  $('wishForm').reset();
  $('wsTitle').textContent = w ? t('wEdit') : t('wNew');
  $('wTitleIn').value = w?.title || ''; $('wUrl').value = w?.url || ''; $('wPrice').value = w?.price || ''; $('wNote').value = w?.note || '';
  $('wReceived').checked = !!w?.received;
  $('wRecWrap').classList.toggle('hidden', !w); $('wDelete').classList.toggle('hidden', !w);
  getKind = chipPicker($('wKind'), [['thing', t('wThing')], ['experience', t('wExp')]], w?.kind || 'thing');
  getPrio = chipPicker($('wPrio'), [['1', t('wWant')], ['2', t('wReally')]], String(w?.priority || 1));
  $('wishSheet').showModal();
}
$('addBtn').onclick = () => openSheet(null);
$('wishSheet').onclose = async () => {
  if ($('wishSheet').returnValue !== 'ok') return;
  let url = $('wUrl').value.trim(); if (url && !/^https?:\/\//i.test(url)) url = 'https://' + url;
  const row = { title:$('wTitleIn').value.trim(), url:url || null, price:$('wPrice').value.trim() || null, note:$('wNote').value.trim() || null,
    kind:getKind(), priority:+getPrio(), received:$('wReceived').checked };
  const q = P.editing ? sb.from('wishes').update(row).eq('id', P.editing.id) : sb.from('wishes').insert({ ...row, couple_id:P.ctx.couple.id });
  const { error } = await q; if (error) alert(errText(error));
  load();
};
$('wDelete').onclick = async () => {
  if (!P.editing || !confirm(t('wConfirmDel'))) return;
  $('wishSheet').close('cancel');
  await sb.from('wishes').delete().eq('id', P.editing.id); load();
};

// ===== Start =====
(async () => {
  applyI18n(); setupBack();
  P.ctx = await requireCouple();
  applyI18n();
  await load();
  show('page', ['loading','page']);
  sb.channel('wishes-' + P.ctx.couple.id)
    .on('postgres_changes', { event:'*', schema:'public', table:'wishes', filter:`couple_id=eq.${P.ctx.couple.id}` }, () => load())
    .on('postgres_changes', { event:'*', schema:'public', table:'wish_reservations', filter:`couple_id=eq.${P.ctx.couple.id}` }, () => load())
    .subscribe();
})().catch(e => { console.error(e); alert(t('loadErr') + errText(e)); });
langHooks.push(() => { if (P.ctx) render(); });
</script>
</body>
</html>

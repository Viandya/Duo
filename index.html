<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duo</title>
<meta name="theme-color" content="#eef3ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Duo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>(function(){try{var p=localStorage.getItem('duo.theme')||'auto';document.documentElement.dataset.theme=(p==='dark'||(p==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches))?'dark':'light';}catch(e){}})();</script>
<link rel="stylesheet" href="common.css?v=7">
<style>
.hero{text-align:center;padding:40px 10px 20px}
.hero h1{font-size:34px;margin-top:10px}
.counter{text-align:center;padding:26px 18px;background:linear-gradient(135deg,var(--grad-a),var(--grad-b));color:#fff}
.counter .num{font-family:Lora,serif;font-size:64px;line-height:1;font-weight:600;display:flex;justify-content:center}
.counter .names{font-size:15px;opacity:.95;margin-bottom:8px}
.counter .sub{opacity:.9;margin-top:6px}
.q{font-family:Lora,serif;font-size:20px;font-style:italic;line-height:1.35;margin:4px 0 14px}
.ans{background:var(--bg);border-radius:14px;padding:12px 14px;margin-top:10px}
.ans .who{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:4px;letter-spacing:.02em}
.lock{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:14px;padding:12px 14px;margin-top:10px;color:var(--muted)}
.list-tile{display:flex;align-items:center;gap:14px;cursor:pointer}
.list-tile .grow{flex:1}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:6px}
.cal-head h2{font-size:20px}
.ev{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
.ev:first-child{border-top:0}
.ev .time{font-weight:700;color:var(--accent);min-width:64px;font-size:14px;padding-top:2px}
.ev .grow{flex:1}
.code{font-family:Lora,serif;font-size:40px;letter-spacing:.18em;text-align:center;font-weight:600;color:var(--accent);margin:10px 0}
.install{background:var(--accent-soft);color:var(--ink);border-radius:16px;padding:12px 14px;font-size:14px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;flex-wrap:wrap}
.setting+.setting{border-top:1px solid var(--line);padding-top:14px;margin-top:8px}
.setting .seg{min-width:200px;flex:1;max-width:290px}
</style>
</head>
<body>

<div id="loading" class="spinner"><img src="icons/icon-192.png" alt=""></div>

<!-- ===== AUTH ===== -->
<section id="auth" class="wrap hidden">
  <div class="hero"><img src="icons/icon-192.png" alt="" width="88" height="88" style="border-radius:22px"><h1>Duo</h1><p class="muted" data-t="tagline"></p></div>
  <div class="card hidden" id="tgAuthCard">
    <button class="btn" id="tgLoginBtn"><svg class="ic"><use href="#i-send"/></svg><span data-t="tgLogin"></span></button>
    <p class="muted small" style="text-align:center;margin:12px 0 0" data-t="tgLoginHint"></p>
    <div class="error" id="tgAuthErr"></div>
  </div>
  <p class="muted small hidden" id="tgOrEmail" style="text-align:center;margin:4px 0 12px" data-t="tgOrEmail"></p>
  <div class="card">
    <div class="seg" style="margin-bottom:6px"><button id="segIn" class="on" data-t="signIn"></button><button id="segUp" data-t="signUp"></button></div>
    <form id="authForm">
      <div id="nameField" class="hidden"><label data-t="yourName"></label><input id="authName" autocomplete="given-name" data-tp="namePh"></div>
      <label>Email</label><input id="authEmail" type="email" autocomplete="email" autocapitalize="none" required>
      <label data-t="password"></label><input id="authPass" type="password" autocomplete="current-password" minlength="6" required>
      <div class="error" id="authErr"></div>
      <button class="btn" id="authBtn" type="submit"></button>
    </form>
  </div>
  <div class="seg" style="max-width:220px;margin:8px auto"><button data-lang="ru">Русский</button><button data-lang="en">English</button></div>
</section>

<!-- ===== ONBOARDING ===== -->
<section id="onboard" class="wrap hidden">
  <div class="hero"><img src="icons/icon-192.png" alt="" width="72" height="72" style="border-radius:18px"><h1><span data-t="hi"></span>, <span id="obName"></span></h1><p class="muted" data-t="obHint"></p></div>
  <div class="card">
    <h2 style="font-size:20px" data-t="createCouple"></h2>
    <label data-t="coupleName"></label><input id="obCoupleName" data-tp="coupleNamePh">
    <label data-t="startDate"></label><button type="button" class="field" data-date id="obStart"></button>
    <div class="error" id="obErr1"></div>
    <button class="btn" id="obCreate" data-t="create"></button>
  </div>
  <div class="card">
    <h2 style="font-size:20px" data-t="haveCode"></h2>
    <label data-t="inviteCode"></label><input id="obCode" placeholder="ABC123" autocapitalize="characters" maxlength="6" style="text-transform:uppercase;letter-spacing:.15em">
    <div class="error" id="obErr2"></div>
    <button class="btn ghost" id="obJoin" data-t="join"></button>
  </div>
  <button class="btn link" id="obLogout" style="margin:0 auto" data-t="logout"></button>
</section>

<!-- ===== APP ===== -->
<main id="app" class="hidden">
  <section id="tab-home" class="wrap">
    <div id="installHint" class="install hidden"><svg class="ic" style="color:var(--accent)"><use href="#i-phone"/></svg><div style="flex:1" data-t="installHint"></div><button class="icon-btn" id="installClose" aria-label="close"><svg class="ic"><use href="#i-x"/></svg></button></div>
    <div class="card counter">
      <div class="names" id="hNames"></div>
      <div class="num" id="hDays">0</div>
      <div class="sub" id="hDaysLabel"></div>
    </div>
    <div class="card">
      <div class="section-h"><h2 data-t="qotd"></h2><span class="muted small" id="qDate"></span></div>
      <div class="q" id="qText"></div>
      <div id="qBody"></div>
    </div>
    <div class="card">
      <div class="section-h"><h2 data-t="importantDates"></h2><button class="add-btn" id="addDateBtn" aria-label="+"><svg class="ic"><use href="#i-plus"/></svg></button></div>
      <div id="datesList"></div>
    </div>
    <div class="card">
      <div class="section-h"><h2 data-t="soon"></h2><button class="btn link" data-goto="plan" data-t="open"></button></div>
      <div id="homeEvents"></div>
    </div>
  </section>

  <section id="tab-plan" class="wrap hidden">
    <div class="page-title"><h1 data-t="plan"></h1><button class="add-btn" id="planAdd" aria-label="+"><svg class="ic"><use href="#i-plus"/></svg></button></div>
    <div class="seg" style="margin-bottom:14px" id="planSeg"><button data-view="cal" class="on" data-t="calendar"></button><button data-view="lists" data-t="lists"></button></div>
    <div id="planCal">
      <div class="card">
        <div class="cal-head"><button class="icon-btn" id="calPrev" aria-label="prev"><svg class="ic"><use href="#i-left"/></svg></button><h2 id="calMonth"></h2><button class="icon-btn" id="calNext" aria-label="next"><svg class="ic"><use href="#i-right"/></svg></button></div>
        <div class="grid" id="calGrid"></div>
      </div>
      <div class="card">
        <div class="section-h"><h2 id="selDayTitle"></h2></div>
        <div id="dayEvents"></div>
      </div>
    </div>
    <div id="planLists" class="hidden">
      <div id="listsIndex"><div id="listsWrap"></div></div>
      <div id="listDetail" class="hidden">
        <div class="page-title" style="margin-top:0">
          <button class="btn link" id="backToLists" style="padding-left:0"><svg class="ic"><use href="#i-left"/></svg><span data-t="lists"></span></button>
          <button class="icon-btn" id="delListBtn" aria-label="delete"><svg class="ic"><use href="#i-trash"/></svg></button>
        </div>
        <div class="card">
          <div class="row-item" style="padding-top:0"><div class="bubble" id="ldIcon"></div><h1 id="ldTitle" style="font-size:24px"></h1></div>
          <div id="ldItems"></div>
          <form class="add-row" id="addItemForm"><input id="newItem" data-tp="addItem" autocomplete="off"><button class="add-btn" type="submit" aria-label="+"><svg class="ic"><use href="#i-plus"/></svg></button></form>
          <button class="btn link small" id="clearDone" style="margin-top:8px" data-t="clearDone"></button>
        </div>
      </div>
    </div>
  </section>

  <section id="tab-sections" class="wrap hidden">
    <div class="page-title"><h1 data-t="sections"></h1><button class="btn link" id="editSections" data-t="edit"></button></div>
    <div class="tiles" id="tiles"></div>
  </section>

  <section id="tab-me" class="wrap hidden">
    <div class="page-title"><h1 data-t="profile"></h1></div>
    <div class="card">
      <h2 style="font-size:20px" data-t="partnerCode"></h2>
      <p class="muted small" id="partnerStatus"></p>
      <div class="code" id="inviteCode"></div>
      <button class="btn ghost" id="shareCode"><svg class="ic"><use href="#i-share"/></svg><span data-t="sendCode"></span></button>
    </div>
    <div class="card">
      <h2 style="font-size:20px" data-t="aboutUs"></h2>
      <label data-t="myName"></label><input id="meName">
      <label data-t="coupleName"></label><input id="meCouple">
      <label data-t="startDateUs"></label><button type="button" class="field" data-date id="meStart"></button>
      <div class="error" id="meErr"></div>
      <button class="btn" id="meSave" data-t="save"></button>
    </div>
    <div class="card">
      <h2 style="font-size:20px" data-t="tgNotif"></h2>
      <p class="muted small" id="tgStatus"></p>
      <button class="btn ghost" id="tgBtn"></button>
    </div>
    <div class="card">
      <h2 style="font-size:20px;margin-bottom:10px" data-t="settings"></h2>
      <div class="setting"><span data-t="language"></span><div class="seg"><button data-lang="ru">Русский</button><button data-lang="en">English</button></div></div>
      <div class="setting"><span data-t="theme"></span><div class="seg"><button data-theme-opt="auto" data-t="themeAuto"></button><button data-theme-opt="light" data-t="themeLight"></button><button data-theme-opt="dark" data-t="themeDark"></button></div></div>
    </div>
    <button class="btn link" id="logout" style="margin:0 auto"><svg class="ic"><use href="#i-logout"/></svg><span data-t="logoutAcc"></span></button>
  </section>

  <nav class="tabbar"><div class="in">
    <button class="tab on" data-tab="home"><svg class="ic"><use href="#i-heart"/></svg><span data-t="tabHome"></span></button>
    <button class="tab" data-tab="plan"><svg class="ic"><use href="#i-calendar"/></svg><span data-t="plan"></span></button>
    <button class="tab" data-tab="sections"><svg class="ic"><use href="#i-grid"/></svg><span data-t="sections"></span></button>
    <button class="tab" data-tab="me"><svg class="ic"><use href="#i-user"/></svg><span data-t="profile"></span></button>
  </div></nav>
</main>

<!-- ===== SHEETS ===== -->
<dialog id="dateSheet"><form class="sheet" method="dialog" id="dateForm">
  <h2 data-t="importantDate"></h2>
  <label data-t="whatDate"></label><input id="dTitle" required data-tp="whatDatePh">
  <label data-t="date"></label><button type="button" class="field" data-date id="dDate"></button>
  <label data-t="icon"></label><div class="icon-pick" id="dIcon"></div>
  <label class="toggle"><input type="checkbox" id="dYearly" checked><span data-t="yearly"></span></label>
  <div class="error" id="dErr"></div>
  <div class="actions"><button class="btn ghost" value="cancel" formnovalidate data-t="cancel"></button><button class="btn" value="ok" data-t="save"></button></div>
</form></dialog>

<dialog id="listSheet"><form class="sheet" method="dialog" id="listForm">
  <h2 data-t="newList"></h2>
  <label data-t="title"></label><input id="lTitle" required data-tp="listPh">
  <label data-t="icon"></label><div class="icon-pick" id="lIcon"></div>
  <div class="actions"><button class="btn ghost" value="cancel" formnovalidate data-t="cancel"></button><button class="btn" value="ok" data-t="create"></button></div>
</form></dialog>

<dialog id="eventSheet"><form class="sheet" method="dialog" id="eventForm">
  <h2 data-t="event"></h2>
  <label data-t="what"></label><input id="eTitle" required data-tp="eventPh">
  <label data-t="day"></label><button type="button" class="field" data-date id="eDate"></button>
  <label class="toggle"><input type="checkbox" id="eAllDay"><span data-t="allDay"></span></label>
  <div id="eTimeWrap"><label data-t="time"></label><div class="two"><select id="eHour"></select><select id="eMin"></select></div></div>
  <label data-t="note"></label><textarea id="eNote" data-tp="optional"></textarea>
  <div class="actions"><button class="btn ghost" value="cancel" formnovalidate data-t="cancel"></button><button class="btn" value="ok" data-t="save"></button></div>
</form></dialog>

<script async src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="common.js?v=7"></script>

// ===== State =====
const S = { user:null, profile:null, couple:null, partner:null, dates:[], lists:[], items:[], events:[],
  question:null, answers:[], openList:null, calMonth:null, selDay:null, channel:null, tgLinked:false, planView:'cal', summary:{} };
const LIST_ICONS = ['list','cart','film','pin','gift','book','food','plane','home','game','leaf','bulb'];
const DATE_ICONS = ['heart','cake','gift','ring','plane','star','home','leaf','glass','pin'];
const safeIcon = (n, set, d) => set.includes(n) ? n : d;
const SCREENS = ['loading','auth','onboard','app'];

function fillTimeSelects(){
  const h = $('eHour').value || '19', m = $('eMin').value || '00';
  $('eHour').innerHTML = Array.from({length:24}, (_,i) => `<option value="${pad(i)}">${pad(i)}</option>`).join('');
  $('eMin').innerHTML = Array.from({length:12}, (_,i) => `<option value="${pad(i*5)}">${pad(i*5)}</option>`).join('');
  $('eHour').value = h; $('eMin').value = m;
}
let signUpMode = false;
langHooks.push(() => { $('authBtn').textContent = signUpMode ? t('signUpBtn') : t('signInBtn'); fillTimeSelects(); if (S.couple) renderAll(); });
document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => setLang(b.dataset.lang, S.user?.id));
document.querySelectorAll('[data-theme-opt]').forEach(b => b.onclick = () => { setPref('theme', b.dataset.themeOpt); applyTheme(); });

// ===== Telegram sign-in =====
let tgAutoTried = false, tgLinkTried = false;
$('tgLoginBtn').onclick = async () => {
  $('tgAuthErr').textContent = ''; $('tgLoginBtn').disabled = true;
  try { await tgAuth('create'); } catch(e){ $('tgAuthErr').textContent = e.message; }

// ===== Email auth =====
function setMode(up){ signUpMode = up; $('segIn').classList.toggle('on',!up); $('segUp').classList.toggle('on',up);
  $('nameField').classList.toggle('hidden',!up); $('authBtn').textContent = up ? t('signUpBtn') : t('signInBtn');
  $('authPass').autocomplete = up ? 'new-password' : 'current-password'; $('authErr').textContent=''; }
$('segIn').onclick = () => setMode(false);
$('segUp').onclick = () => setMode(true);
$('authForm').onsubmit = async e => {
  e.preventDefault(); $('authErr').textContent=''; $('authBtn').disabled = true;
  const email = $('authEmail').value.trim().toLowerCase(), password = $('authPass').value;
  try {
    if (signUpMode) {
      const name = $('authName').value.trim();
      if (!name) throw new Error(t('enterName'));
      const { data, error } = await sb.auth.signUp({ email, password, options:{ data:{ display_name:name, lang:LANG }, emailRedirectTo: location.origin + location.pathname } });
      if (error) throw error;
      if (!data.session) { $('authErr').textContent = t('checkEmail'); setMode(false); }
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
    }
  } catch(err){ $('authErr').textContent = errText(err); }
  $('authBtn').disabled = false;
};
async function logout(){ if (S.channel) sb.removeChannel(S.channel); S.channel = null; S.couple = null; await sb.auth.signOut(); }
$('logout').onclick = logout; $('obLogout').onclick = logout;

// ===== Boot =====
let booting = false;
async function boot(session){
  if (booting) return; booting = true;
  try {
    if (!session) {
      S.user = null;
      if (inTG && !tgAutoTried) { tgAutoTried = true; try { if (await tgAuth('auto')) return; } catch(e){ console.error(e); } }
      $('tgAuthCard').classList.toggle('hidden', !inTG); $('tgOrEmail').classList.toggle('hidden', !inTG);
      show('auth', SCREENS); return;
    }
    S.user = session.user;
    if (inTG && !tgLinkTried) { tgLinkTried = true; try { await sb.rpc('tg_link_webapp', { p_init_data: TG_INIT }); } catch(_){} }
    const { data: profile, error } = await sb.from('profiles').select('*').eq('id', S.user.id).single();
    if (error) throw error;
    S.profile = profile;
    if (profile.lang && profile.lang !== LANG && T[profile.lang]) { LANG = profile.lang; setPref('lang', LANG); applyI18n(); }
    if (!profile.couple_id) { $('obName').textContent = profile.display_name; setDate($('obStart'), ymd(today())); show('onboard', SCREENS); return; }
    await loadAll();
    subscribe();
    show('app', SCREENS);
    if (location.hash === '#sections') goTab('sections');
  } catch(err){ console.error(err); alert(t('loadErr') + errText(err)); show('auth', SCREENS); }
  finally { booting = false; }
}
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'INITIAL_SESSION' || event === 'SIGNED_IN' || event === 'SIGNED_OUT') setTimeout(() => boot(session), 0);
});

// ===== Data =====
async function loadAll(){
  const cid = S.profile.couple_id, d = ymd(today());
  const [c, p, dt, l, it, ev, q, an, tl] = await Promise.all([
    sb.from('couples').select('*').eq('id', cid).single(),
    sb.from('profiles').select('*').eq('couple_id', cid),
    sb.from('important_dates').select('*').order('date'),
    sb.from('lists').select('*').order('created_at'),
    sb.from('list_items').select('*').order('created_at'),
    sb.from('events').select('*').order('starts_at'),
    sb.rpc('daily_question', { p_date: d }),
    sb.from('answers').select('*').eq('answer_date', d),
    sb.rpc('tg_is_linked'),
  ]);
  for (const r of [c,p,dt,l,it,ev,q,an]) if (r.error) throw r.error;
  S.couple = c.data;
  S.profile = p.data.find(x => x.id === S.user.id) || S.profile;
  S.partner = p.data.find(x => x.id !== S.user.id) || null;
  S.dates = dt.data; S.lists = l.data; S.items = it.data; S.events = ev.data; S.answers = an.data;
  S.tgLinked = !tl.error && tl.data === true;
  S.question = q.data?.[0] || null;
  if (S.question) { const { data: qe } = await sb.from('questions').select('text_en').eq('id', S.question.id).single(); S.question.text_en = qe?.text_en; }
  renderAll();
  loadSummary();
}
// Small summaries for the section tiles (each section has its own page)
async function loadSummary(){
  const [w, tr, cs, pcs] = await Promise.all([
    sb.from('wishes').select('owner_id, received'),
    sb.from('trips').select('title,start_date,end_date').order('start_date', { ascending: true, nullsFirst: false }),
    sb.rpc('cycle_status'),
    S.partner ? sb.rpc('cycle_status', { p_user: S.partner.id }) : Promise.resolve({ data: null })
  ]);
  S.summary = { wishes: w.data || [], trips: tr.data || [], cycle: cs.data, partnerCycle: pcs.data };
  renderTiles();
}
let reloadTimer;
function scheduleReload(){ clearTimeout(reloadTimer); reloadTimer = setTimeout(() => loadAll().catch(console.error), 250); }
function subscribe(){
  if (S.channel) sb.removeChannel(S.channel);
  const cid = S.profile.couple_id;
  const ch = sb.channel('couple-' + cid);
  ['important_dates','lists','list_items','events','answers'].forEach(tb =>
    ch.on('postgres_changes', { event:'*', schema:'public', table:tb, filter:`couple_id=eq.${cid}` }, scheduleReload));
  ch.on('postgres_changes', { event:'*', schema:'public', table:'couples', filter:`id=eq.${cid}` }, scheduleReload);
  ch.on('postgres_changes', { event:'*', schema:'public', table:'profiles', filter:`couple_id=eq.${cid}` }, scheduleReload);
  ch.subscribe();
  S.channel = ch;
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState==='visible' && S.couple) scheduleReload(); });
window.addEventListener('pageshow', e => { if (e.persisted && S.couple) scheduleReload(); });

// ===== Render =====
function renderAll(){ if (!S.couple) return; renderHome(); renderLists(); renderCal(); renderMe(); renderTiles(); }
function upcomingDates(){
  const td = today(), out = [];
  const next = (dateStr, yearly) => {
    const d = parseYmd(dateStr);
    if (!yearly) return d;
    let n = new Date(td.getFullYear(), d.getMonth(), d.getDate());
    if (n < td) n = new Date(td.getFullYear()+1, d.getMonth(), d.getDate());
    return n;
  };
  if (S.couple?.start_date) {
    const n = next(S.couple.start_date, true), yrs = n.getFullYear() - parseYmd(S.couple.start_date).getFullYear();
    if (yrs > 0) out.push({ id:null, title:t('yearsTogether', yrs), icon:'heart', when:n });
  }
  for (const x of S.dates) { const n = next(x.date, x.repeats_yearly); if (n >= td) out.push({ id:x.id, title:x.title, icon:safeIcon(x.emoji, DATE_ICONS, 'heart'), when:n }); }
  return out.sort((a,b) => a.when - b.when);
}

function renderHome(){
  const names = [S.profile?.display_name, S.partner?.display_name].filter(Boolean).join(' & ');
  $('hNames').textContent = S.couple?.name && S.couple.name !== 'Мы' ? S.couple.name : names;
  if (S.couple?.start_date) {
    const n = dayDiff(parseYmd(S.couple.start_date), today()) + 1;
    $('hDays').textContent = n.toLocaleString(LANG === 'en' ? 'en-US' : 'ru-RU');
    $('hDaysLabel').textContent = t('daysTogether', n);
  } else { $('hDays').innerHTML = icon('heart', 'width:56px;height:56px'); $('hDaysLabel').textContent = t('setDateHint'); }

  $('qDate').textContent = fmtDay(today());
  $('qText').textContent = S.question ? (LANG === 'en' && S.question.text_en ? S.question.text_en : S.question.text) : t('noQuestions');
  const mine = S.answers.find(a => a.user_id === S.user.id), theirs = S.answers.find(a => a.user_id !== S.user.id);
  const pName = esc(S.partner?.display_name || t('partner'));
  if (!S.question) $('qBody').innerHTML = '';
  else if (!mine) {
    $('qBody').innerHTML = `<textarea id="qAnswer" placeholder="${esc(t('answerPh'))}"></textarea>
      <p class="muted small">${S.partner ? t('bothOpen') : t('invitePartner')}</p>
      <button class="btn" id="qSend">${t('answer')}</button>`;
    $('qSend').onclick = sendAnswer;
  } else {
    $('qBody').innerHTML = `<div class="ans"><div class="who">${t('you')}</div>${esc(mine.answer)}</div>` +
      (theirs ? `<div class="ans"><div class="who">${pName}</div>${esc(theirs.answer)}</div>`
              : `<div class="lock">${icon('clock')}<span>${S.partner ? t('notAnswered', pName) : t('partnerNotJoined')}</span></div>`);
  }

  const ud = upcomingDates();
  $('datesList').innerHTML = ud.length ? ud.map(x => `<div class="row-item"><div class="bubble">${icon(x.icon)}</div>
      <div class="grow"><div>${esc(x.title)}</div><div class="muted small">${fmtDay(x.when)}</div></div>
      <span class="badge">${untilLabel(x.when)}</span>
      ${x.id ? `<button class="icon-btn" data-del-date="${x.id}" aria-label="delete">${icon('x')}</button>` : ''}</div>`).join('')
    : `<div class="empty">${t('datesEmpty')}</div>`;

  const now = new Date();
  const soon = S.events.filter(e => new Date(e.starts_at) >= (e.all_day ? today() : now)).slice(0,3);
  $('homeEvents').innerHTML = soon.length ? soon.map(evRow).join('') : `<div class="empty">${t('eventsEmpty')}</div>`;
}
async function sendAnswer(){
  const text = $('qAnswer').value.trim(); if (!text) return;
  $('qSend').disabled = true;
  const { error } = await sb.from('answers').insert({ couple_id:S.couple.id, question_id:S.question.id, answer_date:ymd(today()), answer:text });
  if (error) { alert(errText(error)); $('qSend').disabled = false; return; }
  await loadAll();
}

let getDateIcon;

$('dateForm').addEventListener('submit', e => {

function setPlanView(v){

  document.querySelectorAll('#planSeg button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  $('planCal').classList.toggle('hidden', v !== 'cal'); $('planLists').classList.toggle('hidden', v !== 'lists');

function renderLists(){
  $('listsWrap').innerHTML = S.lists.length ? S.lists.map(l => {
    const its = S.items.filter(i => i.list_id === l.id), left = its.filter(i => !i.done).length;
    return `<div class="card list-tile" data-list="${l.id}"><div class="bubble">${icon(safeIcon(l.emoji, LIST_ICONS, 'list'))}</div>
      <div class="grow"><h3 style="font-size:18px">${esc(l.title)}</h3><div class="muted small">${its.length ? t('itemsLeft', left, its.length) : t('emptyList')}</div></div>
      <span class="muted">${icon('right')}</span></div>`;
  }).join('') : `<div class="card empty">${t('listsEmpty')}</div>`;
  if (S.openList) {
    const l = S.lists.find(x => x.id === S.openList);
    if (!l) { closeList(); return; }
    $('ldIcon').innerHTML = icon(safeIcon(l.emoji, LIST_ICONS, 'list'));
    $('ldTitle').textContent = l.title;
    const its = S.items.filter(i => i.list_id === l.id).sort((a,b) => (a.done - b.done) || a.created_at.localeCompare(b.created_at));
    $('ldItems').innerHTML = its.length ? its.map(i => `<div class="item ${i.done?'done':''}">
      <button class="check" data-toggle="${i.id}" aria-label="check">${i.done ? icon('check') : ''}</button>
      <div class="txt">${esc(i.text)}</div><button class="icon-btn" data-del-item="${i.id}" aria-label="delete">${icon('x')}</button></div>`).join('')
      : `<div class="empty">${t('listEmptyItems')}</div>`;
  }
}
function openList(id){ S.openList = id; $('listsIndex').classList.add('hidden'); $('listDetail').classList.remove('hidden'); renderLists(); }
function closeList(){ S.openList = null; $('listsIndex').classList.remove('hidden'); $('listDetail').classList.add('hidden'); }
$('listsWrap').onclick = e => { const id = e.target.closest('[data-list]')?.dataset.list; if (id) openList(id); };
$('backToLists').onclick = closeList;
$('ldItems').onclick = async e => {

$('addItemForm').onsubmit = async e => {

$('clearDone').onclick = async () => {
  const ids = S.items.filter(i => i.list_id === S.openList && i.done).map(i => i.id); if (!ids.length) return;
  S.items = S.items.filter(i => !ids.includes(i.id)); renderLists();

$('delListBtn').onclick = async () => {
  if (!confirm(t('confirmDelList'))) return;
  const id = S.openList; closeList(); S.lists = S.lists.filter(l => l.id !== id); renderLists();
  await sb.from('lists').delete().eq('id', id);
};
let getListIcon;
function openListSheet(){ $('listForm').reset(); getListIcon = iconPicker($('lIcon'), LIST_ICONS, 'list'); $('listSheet').showModal(); }
$('listSheet').onclose = async () => {
  if ($('listSheet').returnValue !== 'ok') return;
  const { data, error } = await sb.from('lists').insert({ couple_id:S.couple.id, title:$('lTitle').value.trim(), emoji:getListIcon() }).select().single();
  if (error) return alert(errText(error));
  if (!S.lists.some(l => l.id === data.id)) S.lists.push(data); openList(data.id);

const evDayKey = e => ymd(new Date(e.starts_at));
function evRow(e){
  const d = new Date(e.starts_at);
  const time = e.all_day ? t('allDayShort') : `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const isToday = ymd(d) === ymd(new Date());
  return `<div class="ev"><div class="time">${isToday ? '' : `<div>${d.getDate()} ${t('monthsShort')[d.getMonth()]}</div>`}<div class="${isToday?'':'muted small'}">${time}</div></div>
    <div class="grow"><div>${esc(e.title)}</div>${e.note ? `<div class="muted small">${esc(e.note)}</div>` : ''}</div>
    <button class="icon-btn" data-del-ev="${e.id}" aria-label="delete">${icon('x')}</button></div>`;
}
function renderCal(){
  if (!S.calMonth) { const td = today(); S.calMonth = new Date(td.getFullYear(), td.getMonth(), 1); S.selDay = ymd(td); }
  const m = S.calMonth;
  $('calMonth').textContent = `${t('months')[m.getMonth()]} ${m.getFullYear()}`;
  const first = (m.getDay() + 6) % 7, start = new Date(m.getFullYear(), m.getMonth(), 1 - first);
  const withEv = new Set(S.events.map(evDayKey)), todayKey = ymd(today());
  let html = t('dow').map(d => `<div class="dow">${d}</div>`).join('');
  for (let i = 0; i < 42; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i), k = ymd(d);
    if (i >= 35 && d.getMonth() !== m.getMonth()) break;
    html += `<button class="day ${d.getMonth()!==m.getMonth()?'other':''} ${k===todayKey?'today':''} ${k===S.selDay?'sel':''}" data-day="${k}">${d.getDate()}${withEv.has(k)?'<span class="dot"></span>':''}</button>`;
  }
  $('calGrid').innerHTML = html;
  $('selDayTitle').textContent = S.selDay === todayKey ? t('todayTitle') : fmtDay(parseYmd(S.selDay));
  const evs = S.events.filter(e => evDayKey(e) === S.selDay);
  $('dayEvents').innerHTML = evs.length ? evs.map(evRow).join('') : `<div class="empty">${t('freeDay')}</div>`;
}
$('calPrev').onclick = () => { S.calMonth = new Date(S.calMonth.getFullYear(), S.calMonth.getMonth()-1, 1); renderCal(); };
$('calNext').onclick = () => { S.calMonth = new Date(S.calMonth.getFullYear(), S.calMonth.getMonth()+1, 1); renderCal(); };
$('calGrid').onclick = e => { const k = e.target.closest('[data-day]')?.dataset.day; if (!k) return; S.selDay = k;
  const d = parseYmd(k); if (d.getMonth() !== S.calMonth.getMonth()) S.calMonth = new Date(d.getFullYear(), d.getMonth(), 1); renderCal(); };
async function delEvent(e){
  const id = e.target.closest('[data-del-ev]')?.dataset.delEv; if (!id) return;
  if (!confirm(t('confirmDelEvent'))) return;
  S.events = S.events.filter(x => x.id !== id); renderCal(); renderHome();
  await sb.from('events').delete().eq('id', id);
}
$('dayEvents').onclick = delEvent; $('homeEvents').onclick = delEvent;
$('eAllDay').onchange = () => $('eTimeWrap').classList.toggle('hidden', $('eAllDay').checked);
function openEventSheet(){ $('eventForm').reset(); fillTimeSelects(); $('eHour').value = '19'; $('eMin').value = '00'; $('eTimeWrap').classList.remove('hidden'); setDate($('eDate'), S.selDay || ymd(today())); $('eventSheet').showModal(); }
$('eventSheet').onclose = async () => {
  if ($('eventSheet').returnValue !== 'ok' || !getDate($('eDate'))) return;
  const allDay = $('eAllDay').checked;
  const d = parseYmd(getDate($('eDate'))); if (!allDay) d.setHours(+$('eHour').value, +$('eMin').value);
  const { data, error } = await sb.from('events').insert({ couple_id:S.couple.id, title:$('eTitle').value.trim(), starts_at:d.toISOString(), all_day:allDay, note:$('eNote').value.trim() || null }).select().single();
  if (error) return alert(errText(error));
  if (!S.events.some(x => x.id === data.id)) { S.events.push(data); S.events.sort((a,b) => a.starts_at.localeCompare(b.starts_at)); }
  S.selDay = ymd(d); S.calMonth = new Date(d.getFullYear(), d.getMonth(), 1); renderCal(); renderHome();
};

// ===== Sections =====
let editingTiles = false;
const hiddenTiles = () => { try { return JSON.parse(pref('hiddenSections', '[]')); } catch(_) { return []; } };
function tileDefs(){
  const sm = S.summary || {};
  const w = sm.wishes || [], mineW = w.filter(x => x.owner_id === S.user.id && !x.received).length, partW = w.filter(x => x.owner_id !== S.user.id && !x.received).length;
  const td = ymd(today()), trips = sm.trips || [];
  const now = trips.find(x => x.start_date && x.start_date <= td && (x.end_date || x.start_date) >= td);
  const next = trips.find(x => x.start_date && x.start_date > td);
  const ph = c => t('phase')[c?.phase] || '';
  let cycleSub = t('cycleEmpty');
  if (sm.cycle?.has_data) cycleSub = t('cycleDay', sm.cycle.day, ph(sm.cycle));
  else if (sm.partnerCycle?.has_data && S.partner) cycleSub = t('partnerCycle', S.partner.display_name, ph(sm.partnerCycle));
  return [
    { id:'wishes', icon:'gift', href:'wishes.html', title:t('sWishes'), sub: w.length ? t('wishesSub', mineW, partW) : t('wishesEmpty') },
    { id:'trips', icon:'plane', href:'trips.html', title:t('sTrips'), sub: now ? t('tripsNow', now.title) : next ? t('tripsNext', next.title, untilLabel(parseYmd(next.start_date))) : t('tripsEmpty') },
    { id:'cycle', icon:'droplet', href:'cycle.html', title:t('sCycle'), sub: cycleSub },
    { id:'lists', icon:'list', action:'lists', title:t('sLists'), sub: t('listsSub', S.lists.length) },
    { id:'moments', icon:'photo', soon:true, title:t('sMoments'), sub:t('soonLabel') },
    { id:'budget', icon:'wallet', soon:true, title:t('sBudget'), sub:t('soonLabel') },
  ];
}
function renderTiles(){
  if (!S.couple) return;
  const hidden = hiddenTiles();
  const defs = tileDefs().filter(d => editingTiles || !hidden.includes(d.id));
  let html = defs.map(d => {
    const tag = d.href && !editingTiles ? 'a' : 'button';
    const isHidden = hidden.includes(d.id);
    return `<${tag} class="tile ${d.soon ? 'soon' : ''}" ${tag === 'a' ? `href="${d.href}"` : `type="button" data-tile="${d.id}"`} style="${isHidden ? 'opacity:.4' : ''}">
      ${editingTiles ? `<span class="hide-x icon-btn" data-hide="${d.id}">${icon(isHidden ? 'eye' : 'x')}</span>` : ''}
      <div class="bubble">${icon(d.icon)}</div><div><b>${esc(d.title)}</b><div class="muted">${esc(d.sub)}</div></div></${tag}>`;
  }).join('');
  if (!editingTiles && hidden.length) html += `<button type="button" class="tile add" id="showHidden">${icon('eye')}<span class="small">${t('hiddenN', hidden.length)}</span></button>`;
  $('tiles').innerHTML = html;
  $('editSections').textContent = editingTiles ? t('editDone') : t('edit');
}
$('tiles').onclick = e => {
  const h = e.target.closest('[data-hide]')?.dataset.hide;
  if (h) { e.preventDefault(); const hid = hiddenTiles(); const i = hid.indexOf(h); i >= 0 ? hid.splice(i,1) : hid.push(h); setPref('hiddenSections', JSON.stringify(hid)); renderTiles(); return; }
  if (e.target.closest('#showHidden')) { editingTiles = true; renderTiles(); return; }
  const tid = e.target.closest('[data-tile]')?.dataset.tile;
  if (tid === 'lists' && !editingTiles) { goTab('plan'); setPlanView('lists'); }
};
$('editSections').onclick = () => { editingTiles = !editingTiles; renderTiles(); };

// ===== Profile =====
function renderMe(){
  $('inviteCode').textContent = S.couple.invite_code;
  $('partnerStatus').textContent = S.partner ? t('partnerWith', S.partner.display_name) : t('partnerInvite');
  $('tgStatus').textContent = S.tgLinked ? t('tgOn') : t('tgOff');
  $('tgBtn').innerHTML = `${icon('send')}<span>${S.tgLinked ? t('tgDisconnect') : t('tgConnect')}</span>`;
  if (document.activeElement?.closest?.('#tab-me')) return;
  $('meName').value = S.profile.display_name; $('meCouple').value = S.couple.name; setDate($('meStart'), S.couple.start_date || '');
}
$('shareCode').onclick = async () => {
  const text = t('shareText', S.couple.invite_code);
  if (navigator.share) { try { await navigator.share({ text }); } catch(_){} }
  else { try { await navigator.clipboard.writeText(text); alert(t('copied')); } catch(_) { prompt('', text); } }
};
$('tgBtn').onclick = async () => {
  if (S.tgLinked) {
    if (!confirm(t('confirmTgOff'))) return;
    await sb.rpc('tg_unlink'); S.tgLinked = false; renderMe(); return;
  }
  if (inTG) { const { data } = await sb.rpc('tg_link_webapp', { p_init_data: TG_INIT }); if (data) { S.tgLinked = true; renderMe(); return; } }
  const { data: url, error } = await sb.rpc('tg_create_link');
  if (error) return alert(errText(error));
  openTg(url);
};
$('meSave').onclick = async () => {
  $('meErr').textContent=''; $('meErr').classList.remove('ok-text');
  const r1 = await sb.from('profiles').update({ display_name: $('meName').value.trim() || S.profile.display_name }).eq('id', S.user.id);
  const r2 = await sb.from('couples').update({ name: $('meCouple').value.trim() || 'Мы', start_date: getDate($('meStart')) || null }).eq('id', S.couple.id);
  const err = r1.error || r2.error; if (err) return $('meErr').textContent = errText(err);
  document.activeElement?.blur(); await loadAll(); $('meErr').textContent = t('saved'); $('meErr').classList.add('ok-text');
};

// ===== Tabs =====
function goTab(name){
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  ['home','plan','sections','me'].forEach(x => $('tab-'+x).classList.toggle('hidden', x !== name));
  if (name !== 'sections') editingTiles = false;
  window.scrollTo(0,0);
  try { history.replaceState(null, '', name === 'home' ? location.pathname : '#' + name); } catch(_){}
}
document.querySelectorAll('.tab').forEach(b => b.onclick = () => goTab(b.dataset.tab));
document.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => goTab(b.dataset.goto));
{ const a = tgApp(); try { a?.BackButton?.hide(); } catch(_){} }

// ===== Install hint (iPhone Safari only) =====
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
if (isIOS && !standalone && !inTG && pref('hintClosed', '0') !== '1') $('installHint').classList.remove('hidden');
$('installClose').onclick = () => { $('installHint').classList.add('hidden'); setPref('hintClosed', '1'); };

// ===== Start =====
applyI18n(); applyTheme();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>

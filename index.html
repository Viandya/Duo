<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duo</title>
<meta name="theme-color" content="#eef3ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Duo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>(function(){try{var p=localStorage.getItem('duo.theme')||'auto';document.documentElement.dataset.theme=(p==='dark'||(p==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches))?'dark':'light';}catch(e){}})();</script>
<link rel="stylesheet" href="common.css?v=13">
<style>
.hero{text-align:center;padding:40px 10px 20px}
.hero h1{font-size:34px;margin-top:10px}
.q{font-family:Lora,serif;font-size:18px;font-style:italic;line-height:1.35;margin:4px 0 0}
/* Home */
.h-top{display:flex;align-items:center;gap:10px;margin:4px 0 22px}
.h-top .grow{flex:1;min-width:0}
.h-logo{width:46px;height:46px;flex:none;margin-left:-4px;fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round}
.h-names{font-family:Lora,serif;font-size:21px;font-weight:600;line-height:1.2}
.h-mood{font-size:14px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:7px}
.h-mood i{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:20px}
.qa>*{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;color:var(--muted);cursor:pointer}
.qa span{width:60px;height:60px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;color:var(--accent);transition:transform .15s}
.qa span .ic{width:25px;height:25px}
.qa .hot span{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.qa>*:active span{transform:scale(.92)}
.qa em{white-space:pre-line;font-style:normal;font-size:12.5px;line-height:1.25;text-align:center;max-width:76px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.pair>button:focus{outline:none}
.pair>button{border:0;border-radius:22px;height:104px;padding:16px 14px;text-align:left;cursor:pointer;position:relative;overflow:hidden}
.t-days{background:linear-gradient(150deg,var(--grad-a),var(--grad-b));color:#fff;display:flex;flex-direction:column;justify-content:space-between}
.t-days .bgh{position:absolute;right:-20px;bottom:-24px;width:84px;height:84px;opacity:.16;stroke:#fff;stroke-width:1.6;fill:none}
.t-days .lb{font-size:14px;opacity:.92}
.t-days .n{font-family:Lora,serif;font-size:38px;line-height:1;font-weight:600}
.t-days .n small{font-family:Manrope,sans-serif;font-size:14px;font-weight:500;margin-left:5px;opacity:.92}
.t-next{background:var(--card);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);display:flex;align-items:center;gap:12px}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5.5}
.ring .tr{stroke:var(--line)}.ring .pr{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:Lora,serif;font-size:21px;font-weight:600;color:var(--accent)}
.ring b .ic{width:22px;height:22px}
.t-next{padding:14px 12px!important;gap:10px!important}
.t-next .ring{width:58px;height:58px}.t-next .ring svg{width:58px;height:58px}
.t-next .tt{min-width:0;font-size:14px;font-weight:600;line-height:1.25}
.t-next .tt span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.t-next .tt div{font-size:12.5px;color:var(--accent);font-weight:600;margin-top:4px}
.card.k-day,.card.k-list{box-shadow:inset 0 0 0 1px var(--line);padding:16px}
.kh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.kh h2{font-size:18px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kh .btn.link{padding:4px;flex:none}
.wk{display:flex;justify-content:space-between;gap:3px}
.wk button{flex:1;max-width:44px;border:0;background:none;border-radius:13px;padding:6px 0 11px;font-weight:600;font-size:15px;cursor:pointer;position:relative;color:var(--ink)}
.wk small{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-bottom:2px}
.wk .td{color:var(--accent)}
.wk .on{background:var(--sel-bg);color:var(--sel-ink)}
.wk .on small{color:var(--sel-ink);opacity:.7}
.wk .dots{position:absolute;bottom:4px;left:0;right:0;display:flex;justify-content:center;gap:3px}
.wk .dots i,.day .dots i{width:5px;height:5px;border-radius:50%;display:block}
#wkItems{margin-top:6px}
.qcard{background:var(--warm);border-radius:22px;padding:16px;margin-bottom:14px;color:var(--ink)}
.qcard .lb{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--warm-ink)}
.qcard .q{margin:8px 0 14px}
.qft{display:flex;align-items:center;justify-content:space-between;gap:10px}
.qft #qStatus{font-size:13.5px;font-weight:600;color:var(--warm-ink);display:flex;align-items:center;gap:6px;min-width:0}
.qft #qStatus .ic{width:16px;height:16px}
.qft #qStatus.soft{color:var(--muted);font-weight:500}
.qcard .btn.sm{border-radius:999px;padding:9px 18px;flex:none}
.qcard .ans{background:color-mix(in srgb,var(--card) 70%,transparent)}
.qcard .ans:first-child{margin-top:0}
.qcard .lock{background:none;padding:10px 0 0;margin:0}
/* rows (plan list, day list) */
.ev{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line);align-items:center}
.ev:first-child{border-top:0;padding-top:2px}
.ev:last-child{padding-bottom:2px}
.ev .time{font-weight:700;color:var(--accent);width:46px;font-size:13.5px;line-height:1.2;flex:none}
.ev .time .muted{font-weight:500}
.ev .vbar{width:4px;align-self:stretch;min-height:34px;border-radius:2px;background:var(--accent);flex:none}
.ev .vbar.gold{background:#c99a3b}
.ev .grow{flex:1;min-width:0;font-weight:600}
.ev .grow .muted{font-weight:400}
.grp{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin:20px 6px 8px}
.showchips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.showchips button{border:0;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;gap:6px;cursor:pointer}
.showchips button i{width:8px;height:8px;border-radius:50%}
.showchips button.off{background:none;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line)}
.showchips button.off i{opacity:.4}
/* list rows (sections, profile) */
.k-list .mrow{display:flex;align-items:center;gap:12px;padding:12px 0;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;color:var(--ink);text-decoration:none;font-size:16px;font-weight:600;cursor:pointer}
.k-list .mrow:first-child{border-top:0;padding-top:0}
.k-list .mrow:last-child{padding-bottom:0}
.mrow .grow{flex:1;min-width:0}
.mrow small,.mrow .sub{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-top:2px}
.mrow .chev{color:var(--muted);width:18px;height:18px}
.mrow .mval{color:var(--muted);font-weight:500;font-size:14px;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sq{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none}
.sq .ic{width:21px;height:21px}
.c1{background:var(--accent-soft);color:var(--accent)}
.c2{background:var(--warm);color:var(--warm-ink)}
.c3{background:var(--rose);color:var(--rose-ink)}
.c4{background:var(--blue-s);color:var(--blue)}
.c5{background:var(--violet-s);color:var(--violet)}
.newdot{width:9px;height:9px;border-radius:50%;background:#c99a3b;flex:none}
.cnt{font-family:Lora,serif;font-size:19px;font-weight:600;color:var(--accent)}
.k-list.soon{opacity:.55}
.k-list.soon .mrow{cursor:default}
.k-list .mrow.hid{opacity:.4}
.sw{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--accent)}.sw.on:after{transform:translateX(18px)}
.seg.mini{padding:3px;border-radius:11px;flex:none}
.seg.mini button{padding:6px 9px;font-size:13px;border-radius:9px}
.me-hero{border-radius:24px;padding:22px 18px 16px;background:linear-gradient(150deg,var(--grad-a),var(--grad-b));color:#fff;text-align:center;position:relative;overflow:hidden;margin:4px 0 14px}
.me-hero .bgh{position:absolute;right:-22px;top:-26px;width:150px;height:150px;opacity:.12;stroke:#fff;stroke-width:1.4;fill:none}
.me-hero .avs{display:flex;justify-content:center;margin-bottom:12px}
.me-hero .av{width:62px;height:62px;font-size:22px;border:3px solid rgba(255,255,255,.85);background:rgba(255,255,255,.22)}
.me-hero .av+.av{margin-left:-16px;background:rgba(0,0,0,.14)}
.me-hero .av.empty{border-style:dashed;background:transparent}
.me-hero h2{font-size:22px}
.me-hero .since{font-size:14px;opacity:.9;margin-top:4px}
.me-hero .stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;background:rgba(255,255,255,.15);border-radius:16px;padding:10px 0;font-size:12.5px}
.me-hero .stats b{display:block;font-family:Lora,serif;font-size:22px;font-weight:600;line-height:1.15}
.k-code{text-align:center;box-shadow:inset 0 0 0 1px var(--line)}
.k-code h2{font-size:19px}
.btn.link.logout{margin:18px auto 0;color:#c0564f}
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.moods button{border:1.5px solid var(--line);background:var(--bg);border-radius:16px;padding:14px 6px;font-weight:600;cursor:pointer;color:var(--ink)}
.moods button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
#editSheet input,#editSheet .field{margin-top:14px}
.tap{cursor:pointer}
.ev.tap:active,.row-item.tap:active{opacity:.6}
.ev .chev,.row-item .chev{color:var(--muted);width:18px;height:18px;flex:none}
.btn.link.del-link{color:#c0564f;margin:14px auto 0;display:flex}
.ptr{position:fixed;left:50%;top:calc(8px + var(--safe-t));width:40px;height:40px;margin-left:-20px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--accent);z-index:30;opacity:0;transform:translateY(-60px);pointer-events:none}
.ptr .ic{width:22px;height:22px}
.ptr.spin .ic{animation:ptrspin .8s linear infinite}
@keyframes ptrspin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.status{display:flex;gap:8px;align-items:center;border-radius:12px;padding:10px 12px;margin-top:12px;font-size:14px}
.status.warm{background:var(--warm);color:var(--warm-ink);font-weight:600}
.status.soft{background:var(--bg);color:var(--muted)}
.day.cyc{background:var(--rose);color:var(--rose-ink)}
.day.cyc.sel{background:var(--sel-bg);color:var(--sel-ink)}
.day .dots{position:absolute;bottom:4px;left:0;right:0;display:flex;justify-content:center;gap:3px}
.day .dots i{width:5px;height:5px;border-radius:50%;display:block}
.dot-ev{background:var(--accent)}.dot-dt{background:#c99a3b}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.bubble.gold{background:var(--warm);color:var(--warm-ink)}
.avs{display:flex}.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;border:3px solid var(--card);background:var(--grad-b)}
.av+.av{margin-left:-14px;background:var(--grad-a)}
.ans{background:var(--bg);border-radius:14px;padding:12px 14px;margin-top:10px}
.ans .who{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:4px;letter-spacing:.02em}
.lock{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:14px;padding:12px 14px;margin-top:10px;color:var(--muted)}
.list-tile{display:flex;align-items:center;gap:14px;cursor:pointer}
.list-tile .grow{flex:1}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:6px}
.cal-head h2{font-size:20px}
.day.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.day.today.sel{box-shadow:none}
.code{font-family:Lora,serif;font-size:40px;letter-spacing:.18em;text-align:center;font-weight:600;color:var(--accent);margin:10px 0}
.install{background:var(--accent-soft);color:var(--ink);border-radius:16px;padding:12px 14px;font-size:14px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;flex-wrap:wrap}
.setting+.setting{border-top:1px solid var(--line);padding-top:14px;margin-top:8px}
.setting .seg{min-width:200px;flex:1;max-width:290px}
</style>
</head>
<body>

<div id="loading" class="spinner"><img src="icons/icon-192.png" alt=""></div>

<!-- ===== AUTH ===== -->
<section id="auth" class="wrap hidden">
  <div class="hero"><img src="icons/icon-192.png" alt="" width="88" height="88" style="border-radius:22px"><h1>Duo</h1><p class="muted" data-t="tagline"></p></div>
  <div class="card hidden" id="tgAuthCard">
    <button class="btn" id="tgLoginBtn"><svg class="ic"><use href="#i-send"/></svg><span data-t="tgLogin"></span></button>
    <p class="muted small" style="text-align:center;margin:12px 0 0" data-t="tgLoginHint"></p>
    <div class="error" id="tgAuthErr"></div>
  </div>
  <p class="muted small hidden" id="tgOrEmail" style="text-align:center;margin:4px 0 12px" data-t="tgOrEmail"></p>
  <div class="card">
    <div class="seg" style="margin-bottom:6px"><button id="segIn" class="on" data-t="signIn"></button><button id="segUp" data-t="signUp"></button></div>
    <form id="authForm">
      <div id="nameField" class="hidden"><label data-t="yourName"></label><input id="authName" autocomplete="given-name" data-tp="namePh"></div>
      <label>Email</label><input id="authEmail" type="email" autocomplete="email" autocapitalize="none" required>
      <label data-t="password"></label><input id="authPass" type="password" autocomplete="current-password" minlength="6" required>
      <div class="error" id="authErr"></div>
      <button class="btn" id="authBtn" type="submit"></button>
    </form>
  </div>
  <div class="seg" style="max-width:220px;margin:8px auto"><button data-lang="ru">Русский</button><button data-lang="en">English</button></div>
</section>

<!-- ===== ONBOARDING ===== -->
<section id="onboard" class="wrap hidden">
  <div class="hero"><img src="icons/icon-192.png" alt="" width="72" height="72" style="border-radius:18px"><h1><span data-t="hi"></span>, <span id="obName"></span></h1><p class="muted" data-t="obHint"></p></div>
  <div class="card">
    <h2 style="font-size:20px" data-t="createCouple"></h2>
    <label data-t="coupleName"></label><input id="obCoupleName" data-tp="coupleNamePh">
    <label data-t="startDate"></label><button type="button" class="field" data-date id="obStart"></button>
    <div class="error" id="obErr1"></div>
    <button class="btn" id="obCreate" data-t="create"></button>
  </div>
  <div class="card">
    <h2 style="font-size:20px" data-t="haveCode"></h2>
    <label data-t="inviteCode"></label><input id="obCode" placeholder="ABC123" autocapitalize="characters" maxlength="6" style="text-transform:uppercase;letter-spacing:.15em">
    <div class="error" id="obErr2"></div>
    <button class="btn ghost" id="obJoin" data-t="join"></button>
  </div>
  <button class="btn link" id="obLogout" style="margin:0 auto" data-t="logout"></button>
</section>

<!-- ===== APP ===== -->
<main id="app" class="hidden">
  <section id="tab-home" class="wrap">
    <div id="installHint" class="install hidden"><svg class="ic" style="color:var(--accent)"><use href="#i-phone"/></svg><div style="flex:1" data-t="installHint"></div><button class="icon-btn" id="installClose" aria-label="close"><svg class="ic"><use href="#i-x"/></svg></button></div>
    <div class="h-top">
      <svg class="h-logo" viewBox="0 0 40 40" aria-hidden="true"><path d="M15 29s-8-4.8-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 23 18c0 6.2-8 11-8 11z"/><path d="M25 26s-6.5-3.9-6.5-8.9a3.7 3.7 0 0 1 6.5-2.3 3.7 3.7 0 0 1 6.5 2.3c0 5-6.5 8.9-6.5 8.9z" opacity=".6"/></svg>
      <div class="grow"><div class="h-names" id="hNames"></div><div class="h-mood" id="hMood"></div></div>
    </div>
    <div class="qa">
      <button type="button" class="hot" id="qaPing"><span><svg class="ic"><use href="#i-heart"/></svg></span><em data-t="qaPing"></em></button>
      <button type="button" id="qaMood"><span><svg class="ic"><use href="#i-smile"/></svg></span><em data-t="qaMood"></em></button>
      <a href="movies.html"><span><svg class="ic"><use href="#i-film"/></svg></span><em data-t="qaMovies"></em></a>
      <a href="wishes.html" data-seen="wishes"><span><svg class="ic"><use href="#i-gift"/></svg></span><em data-t="sWishes"></em></a>
    </div>
    <div class="pair">
      <button type="button" class="t-days" id="tDays"></button>
      <button type="button" class="t-next" id="tNext"></button>
    </div>
    <div class="card k-day">
      <div class="kh"><h2 id="wkTitle"></h2><button class="btn link" id="wkPlan"><span data-t="plan"></span> ›</button></div>
      <div class="wk" id="wkStrip"></div>
      <div id="wkItems"></div>
    </div>
    <div class="qcard">
      <div class="lb" data-t="qotd"></div>
      <div class="q" id="qText"></div>
      <div id="qBody"></div>
      <div class="qft" id="qFoot"><span id="qStatus"></span><button class="btn sm" id="qOpen" data-t="answer"></button></div>
    </div>
  </section>

  <section id="tab-plan" class="wrap hidden">
    <div class="page-title"><h1 data-t="plan"></h1><button class="add-btn" id="planAdd" aria-label="+"><svg class="ic"><use href="#i-plus"/></svg></button></div>
    <div class="seg" style="margin-bottom:14px" id="planSeg"><button data-view="cal" class="on" data-t="calendar"></button><button data-view="lists" data-t="lists"></button></div>
    <div id="planCal">
      <div class="card">
        <div class="cal-head"><button class="icon-btn" id="calPrev" aria-label="prev"><svg class="ic"><use href="#i-left"/></svg></button><h2 id="calMonth"></h2><button class="icon-btn" id="calNext" aria-label="next"><svg class="ic"><use href="#i-right"/></svg></button></div>
        <div class="grid" id="calGrid"></div>
        <div class="showchips" id="calShow"></div>
      </div>
      <div class="grp" id="selDayTitle"></div>
      <div class="card k-list"><div id="dayEvents"></div></div>
    </div>
    <div id="planLists" class="hidden">
      <div id="listsIndex"><div id="listsWrap"></div></div>
      <div id="listDetail" class="hidden">
        <div class="page-title" style="margin-top:0">
          <button class="btn link" id="backToLists" style="padding-left:0"><svg class="ic"><use href="#i-left"/></svg><span data-t="lists"></span></button>
          <button class="icon-btn" id="delListBtn" aria-label="delete"><svg class="ic"><use href="#i-trash"/></svg></button>
        </div>
        <div class="card">
          <div class="row-item" style="padding-top:0"><div class="bubble" id="ldIcon"></div><h1 id="ldTitle" style="font-size:24px"></h1></div>
          <div id="ldItems"></div>
          <form class="add-row" id="addItemForm"><input id="newItem" data-tp="addItem" autocomplete="off"><button class="add-btn" type="submit" aria-label="+"><svg class="ic"><use href="#i-plus"/></svg></button></form>
          <button class="btn link small" id="clearDone" style="margin-top:8px" data-t="clearDone"></button>
        </div>

let booting = false;
async function boot(session){
  if (booting) return; booting = true;
  try {
    if (!session) {
      S.user = null;
      if (inTG && !tgAutoTried) { tgAutoTried = true; try { if (await tgAuth('auto')) return; } catch(e){ console.error(e); } }
      $('tgAuthCard').classList.toggle('hidden', !inTG); $('tgOrEmail').classList.toggle('hidden', !inTG);
      show('auth', SCREENS); return;
    }
    S.user = session.user;
    if (inTG && !tgLinkTried) { tgLinkTried = true; try { await sb.rpc('tg_link_webapp', { p_init_data: TG_INIT }); } catch(_){} }
    const { data: profile, error } = await sb.from('profiles').select('*').eq('id', S.user.id).single();
    if (error) throw error;
    S.profile = profile;
    if (profile.lang && profile.lang !== LANG && T[profile.lang]) { LANG = profile.lang; setPref('lang', LANG); applyI18n(); }
    if (!profile.couple_id) { $('obName').textContent = profile.display_name; setDate($('obStart'), ymd(today())); show('onboard', SCREENS); return; }
    await loadAll();
    subscribe();
    show('app', SCREENS);
    if (location.hash === '#sections') goTab('sections');
  } catch(err){ console.error(err); alert(t('loadErr') + errText(err)); show('auth', SCREENS); }
  finally { booting = false; }
}

    sb.rpc('cycle_status'),

    sb.rpc('movie_matches'),
    sb.from('answers').select('id', { count:'exact', head:true }),

  ]);
  S.summary = { wishes: w.data || [], trips: tr.data || [], cycle: cs.data, partnerCycle: pcs.data, movieMatches: (mm.data || []).length,
    answersCount: ac.count || 0, watchedCount: wc.count || 0 };
  // Period days (actual and forecast) to show in the Plan calendar
  const { data: per } = await sb.from('cycle_periods').select('user_id,start_date,end_date').gte('start_date', ymd(addDays(today(), -400)));
  const set = new Set();
  for (const [uid, st] of [[S.user.id, cs.data], [S.partner?.id, pcs.data]]) {
    if (!uid || !st?.has_data) continue;
    const plen = st.period_length || 5;
    (per || []).filter(p => p.user_id === uid).forEach(p => { const s0 = parseYmd(p.start_date), e0 = p.end_date ? parseYmd(p.end_date) : addDays(s0, plen - 1); for (let d = s0; d <= e0; d = addDays(d, 1)) set.add(ymd(d)); });
    if (st.next_start) for (let c = 0; c < 4; c++) { const s0 = addDays(parseYmd(st.next_start), (st.cycle_length || 28) * c); for (let i = 0; i < plen; i++) set.add(ymd(addDays(s0, i))); }

function upcomingDates(){
  const td = today(), out = [];
  const next = (dateStr, yearly) => {
    const d = parseYmd(dateStr);
    if (!yearly) return d;
    let n = new Date(td.getFullYear(), d.getMonth(), d.getDate());
    if (n < td) n = new Date(td.getFullYear()+1, d.getMonth(), d.getDate());
    return n;
  };
  if (S.couple?.start_date) {
    const n = next(S.couple.start_date, true), yrs = n.getFullYear() - parseYmd(S.couple.start_date).getFullYear();
    if (yrs > 0) out.push({ id:null, open:'start', title:t('yearsTogether', yrs), short:t('yearsN', yrs), icon:'heart', when:n });
  }
  for (const x of S.dates) { const n = next(x.date, x.repeats_yearly); if (n >= td) out.push({ id:x.id, open:'dt:' + x.id, title:x.title, icon:safeIcon(x.emoji, DATE_ICONS, 'heart'), when:n }); }
  // birthdays and anniversaries added in the calendar
  for (const e of S.events.filter(e => (e.kind === 'birthday' || e.kind === 'anniversary'))) {
    const n = next(ymd(new Date(e.starts_at)), e.repeat === 'yearly'); if (n >= td) out.push({ id:null, open:'ev:' + e.id, title:e.title, icon:e.kind === 'birthday' ? 'cake' : 'heart', when:n });
  }
  return out.sort((a,b) => a.when - b.when);
}

const HEART_PATH = '<path d="M12 20s-7.5-4.6-9.3-9.2A4.8 4.8 0 0 1 12 7.6a4.8 4.8 0 0 1 9.3 3.2C19.5 15.4 12 20 12 20z"/>';

// Everything on a given day: important dates first, then events
function dayItems(day){
  const dts = datesOn(day).map(x => ({ gold:true, time:x.age ? t('ageN', x.age) : '', title:x.title, open:x.open }));
  const evs = eventsOn(day).map(e => {
    const s = new Date(e.starts_at), y = day.getFullYear() - s.getFullYear();
    const time = isDayKind(e) ? (e.repeat === 'yearly' && y > 0 ? t('ageN', y) : '') : e.all_day ? t('allDayShort') : `${pad(s.getHours())}:${pad(s.getMinutes())}`;
    const sub = [e.repeat && e.repeat !== 'none' ? t('repShort')[e.repeat] : '', e.note || ''].filter(Boolean).join(' · ');
    return { gold:isDayKind(e), time, title:e.title, sub, open:'ev:' + e.id };
  });
  return [...dts, ...evs];
}
const itemRow = x => `<div class="ev ${x.open ? 'tap' : ''}" ${x.open ? `data-open="${x.open}"` : ''}><div class="time">${esc(x.time)}</div><span class="vbar ${x.gold ? 'gold' : ''}"></span>

    $('tNext').innerHTML = `<span class="ring"><svg viewBox="0 0 64 64"><circle class="tr" cx="32" cy="32" r="27"/><circle class="pr" cx="32" cy="32" r="27" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - frac)}"/></svg>

// Repeating events: does event e happen on local day `day`?
const isDayKind = e => e.kind === 'birthday' || e.kind === 'anniversary';
function evOn(e, day){
  const d0 = new Date(e.starts_at); d0.setHours(0,0,0,0);
  if (day < d0) return false;
  switch (e.repeat) {
    case 'daily': return true;
    case 'weekly': return dayDiff(d0, day) % 7 === 0;
    case 'monthly': return day.getDate() === d0.getDate();
    case 'yearly': return day.getDate() === d0.getDate() && day.getMonth() === d0.getMonth();
    default: return ymd(day) === ymd(d0);
  }
}
const eventsOn = day => S.events.filter(e => evOn(e, day)).sort((a,b) => (isDayKind(b) - isDayKind(a)) || (a.all_day === b.all_day ? new Date(a.starts_at).toTimeString().localeCompare(new Date(b.starts_at).toTimeString()) : a.all_day ? -1 : 1));

function datesOn(day){
  const out = S.dates.filter(x => { const d = parseYmd(x.date); return x.repeats_yearly ? (d.getDate() === day.getDate() && d.getMonth() === day.getMonth() && day >= new Date(d.getFullYear(),0,1)) : ymd(d) === ymd(day); })
    .map(x => ({ open:'dt:' + x.id, title:x.title, icon:safeIcon(x.emoji, DATE_ICONS, 'heart'), age: x.repeats_yearly && x.emoji === 'cake' ? day.getFullYear() - parseYmd(x.date).getFullYear() : null }));
  if (S.couple?.start_date) { const s = parseYmd(S.couple.start_date), y = day.getFullYear() - s.getFullYear();
    if (y > 0 && s.getDate() === day.getDate() && s.getMonth() === day.getMonth()) out.unshift({ open:'start', title:t('yearsTogether', y), icon:'heart', age:null }); }
  return out;
}
const KIND_ICON = { event:'calendar', birthday:'cake', anniversary:'heart', date:'glass', reminder:'clock' };
function evRow(e, day){
  day = day || new Date(e.starts_at); const s = new Date(e.starts_at), y = day.getFullYear() - s.getFullYear();
  const time = isDayKind(e) ? (e.repeat === 'yearly' && y > 0 ? t('ageN', y) : '') : e.all_day ? t('allDayShort') : `${pad(s.getHours())}:${pad(s.getMinutes())}`;
  const sub = [e.repeat && e.repeat !== 'none' ? t('repShort')[e.repeat] : '', e.note || ''].filter(Boolean).join(' · ');
  return itemRow({ gold:isDayKind(e), time, title:e.title, sub, open:'ev:' + e.id, del:e.id });

function renderCal(){
  if (!S.calMonth) { const td = today(); S.calMonth = new Date(td.getFullYear(), td.getMonth(), 1); S.selDay = ymd(td); }

  $('calMonth').textContent = `${t('months')[m.getMonth()]} ${m.getFullYear()}`;

// ===== Pull to refresh (home) =====
(function(){
  const el = $('ptr'); let y0 = null, dy = 0, busy = false;
  const active = () => !$('tab-home').classList.contains('hidden') && !document.querySelector('dialog[open]') && window.scrollY <= 0 && S.couple;
  const set = (d, anim) => { el.style.transition = anim ? 'transform .25s, opacity .25s' : 'none'; el.style.transform = `translateY(${Math.min(d, 90) - 60}px)`; el.style.opacity = Math.min(1, d / 70);
    el.querySelector('.ic').style.transform = busy ? '' : `rotate(${d * 3}deg)`; };
  document.addEventListener('touchstart', e => { if (busy || !active()) return; y0 = e.touches[0].clientY; dy = 0; }, { passive:true });
  document.addEventListener('touchmove', e => { if (y0 === null) return; dy = (e.touches[0].clientY - y0) * 0.55; if (dy > 0 && window.scrollY <= 0) set(dy); }, { passive:true });
  document.addEventListener('touchend', async () => {
    if (y0 === null) return; y0 = null;
    if (dy < 70) { set(0, true); return; }
    busy = true; el.classList.add('spin'); set(80, true); haptic();
    try { await loadAll(); } catch(e){ console.error(e); }
    busy = false; el.classList.remove('spin'); set(0, true);
  });
})();

// ===== Install hint (iPhone Safari only) =====
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
if (isIOS && !standalone && !inTG && pref('hintClosed', '0') !== '1') $('installHint').classList.remove('hidden');
$('installClose').onclick = () => { $('installHint').classList.add('hidden'); setPref('hintClosed', '1'); };

// ===== Start =====
applyI18n(); applyTheme();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>

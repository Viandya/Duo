<head>

<title>Duo · Цикл</title>
<meta name="theme-color" content="#eef3ee">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>(function(){try{var p=localStorage.getItem('duo.theme')||'auto';document.documentElement.dataset.theme=(p==='dark'||(p==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches))?'dark':'light';}catch(e){}})();</script>
<link rel="stylesheet" href="common.css?v=14">
<style>
.ringwrap{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.ring{width:170px;height:170px;border-radius:50%;display:grid;place-items:center;margin:4px auto}
.ring>div{width:128px;height:128px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-family:Lora,serif;font-size:34px;font-weight:600;line-height:1}
.phase-name{font-family:Lora,serif;font-size:20px;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:4px;display:inline-block}
.day.per{background:var(--rose);color:var(--rose-ink)}
.day.pred{box-shadow:inset 0 0 0 1.5px var(--rose-ink);color:var(--rose-ink)}
.day.fert{background:var(--accent-soft);color:var(--accent)}
.day.ovu{background:var(--accent);color:var(--accent-ink)}
.day.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.day .idot{position:absolute;top:5px;right:6px;width:5px;height:5px;border-radius:50%;background:#e06b7d}
.share-row{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.share-row:first-child{border-top:0}
.share-row .grow{flex:1}
.share-row b{font-weight:600}
.share-row .muted{font-size:13px}
.switch{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--accent)}
.switch.on::after{left:21px}
.switch.rose.on{background:#e06b7d}
.day.logged::after{content:"";position:absolute;bottom:4px;left:50%;margin-left:-2.5px;width:5px;height:5px;border-radius:50%;background:#c99a3b}
.day.sel{background:var(--sel-bg)!important;color:var(--sel-ink)!important;box-shadow:none}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:6px}
.cal-head h2{font-size:20px}
.card.k{box-shadow:inset 0 0 0 1px var(--line);padding:16px}
.topbar .eye{border:0;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--rose-ink);background:var(--rose);border-radius:99px;padding:7px 12px;cursor:pointer;flex:none}
.topbar .eye .ic{width:16px;height:16px}
.topbar .eye.off{background:var(--accent-soft);color:var(--muted)}
.cring{position:relative;width:118px;height:118px;flex:none}
.cring svg{width:118px;height:118px;transform:rotate(-90deg)}
.cring circle{fill:none;stroke-width:10}
.cring .tr{stroke:var(--line)}.cring .pr{stroke:#e89aab;stroke-linecap:round}
.cring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Lora,serif;font-size:36px;font-weight:600;line-height:1}
.cring b small{font-family:Manrope,sans-serif;font-size:13px;color:var(--muted);font-weight:500;margin-top:4px}
.chead{display:flex;align-items:center;gap:16px}
.chead .lb{font-size:13px;color:var(--muted)}
.chead .phn{font-family:Lora,serif;font-size:21px;font-weight:600;line-height:1.2;margin-top:3px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.facts>div{background:var(--bg);border-radius:14px;padding:10px 12px;font-size:12.5px;color:var(--muted)}
.facts b{display:block;font-size:16px;color:var(--ink);font-weight:700;margin-bottom:2px}
.facts .r b{color:var(--rose-ink)}
.btn.rose{background:#e89aab;color:#2a1218}
.btn.rose.ghost{background:var(--rose);color:var(--rose-ink)}
.lbl{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:14px 0 8px}
.lbl:first-of-type{margin-top:4px}
/* analysis */
.an-hero{border-radius:22px;padding:18px 16px 14px;background:linear-gradient(150deg,#6b3846,#b9707f);color:#fff;margin-bottom:14px}
.an-hero .sub{font-size:13px;opacity:.9}
.an-hero .row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:4px}
.an-hero .big{font-family:Lora,serif;font-size:44px;font-weight:600;line-height:1}
.an-hero .big small{font-family:Manrope,sans-serif;font-size:15px;font-weight:500;margin-left:6px}
.an-hero .rng{font-size:13px;opacity:.92;text-align:right}
.an-grid{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;background:rgba(255,255,255,.15);border-radius:14px;padding:9px 0;text-align:center;font-size:11.5px}
.an-grid b{display:block;font-family:Lora,serif;font-size:20px;font-weight:600}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;position:relative;margin-top:6px}
.bars>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);min-width:0}
.bars i{display:block;width:100%;border-radius:6px 6px 3px 3px;background:#e89aab;opacity:.45}
.bars i.r{opacity:.95}
.bars .avg{position:absolute;left:0;right:0;border-top:1.5px dashed #c99a3b;pointer-events:none}
.bars .avg span{position:absolute;right:0;top:-16px;font-size:11px;color:#c99a3b;font-weight:700}
.ax{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}
.ins{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;color:var(--muted);margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.ins .ic{color:#c99a3b;flex:none;margin-top:1px}
.ins b{color:var(--ink);font-weight:700}
.fc{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.fc:first-of-type{border-top:0;padding-top:0}
.fc .grow{flex:1;font-weight:600}
.fc .grow div{font-size:13px;color:var(--muted);font-weight:500;margin-top:1px}
.sq{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.sq.r{background:var(--rose);color:var(--rose-ink)}.sq.g{background:var(--accent-soft);color:var(--accent)}
.hist{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.hist:first-of-type{border-top:0;padding-top:0}
.hist .d{width:56px;color:var(--muted);font-size:13px;flex:none}
.hist .tr{flex:1;min-width:0}
.strip{height:11px;border-radius:6px;background:var(--line);position:relative;overflow:hidden}
.strip .p{position:absolute;left:0;top:0;bottom:0;background:#e89aab;border-radius:6px}
.strip .f{position:absolute;top:0;bottom:0;background:var(--accent);opacity:.7}
.strip .now{position:absolute;top:0;bottom:0;right:0;background:repeating-linear-gradient(90deg,var(--card) 0 3px,transparent 3px 6px)}
.hist b{width:46px;text-align:right;font-weight:700;flex:none}
.warn{font-size:13px;color:var(--muted);background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:12px;line-height:1.45}
.warn b{color:var(--ink)}
.preview{background:var(--bg);border-radius:14px;padding:11px 13px;font-size:13.5px;color:var(--muted);margin-top:10px;line-height:1.45}
.preview b{color:var(--ink)}
</style>
</head>
<body>
<div id="loading" class="spinner"><img src="icons/icon-192.png" alt=""></div>
<main id="page" class="wrap sub hidden">
  <div class="topbar">
    <button class="icon-btn" data-back aria-label="back"><svg class="ic"><use href="#i-left"/></svg></button>
    <h1 data-t="cTitle"></h1>
    <button class="eye hidden" id="shareBtn"></button>
  </div>
  <div class="seg hidden" style="margin-bottom:12px" id="whoSeg"><button data-who="me" class="on" data-t="cMine"></button><button data-who="partner" id="partnerTabBtn"></button></div>

  <!-- My cycle -->
  <div id="mine">
    <div class="card hidden" id="intro">
      <div class="bubble" style="margin-bottom:10px"><svg class="ic"><use href="#i-droplet"/></svg></div>
      <h2 style="font-size:20px" data-t="cIntroTitle"></h2>
      <p class="muted small" data-t="cIntroText"></p>
      <label data-t="cLastStart"></label><button type="button" class="field" data-date id="introDate"></button>
      <div class="two" style="margin-top:4px"><div><label data-t="cCycleLen"></label><input id="introLen" type="number" inputmode="numeric" min="18" max="60" value="28"></div><div><label data-t="cPeriodLen"></label><input id="introPlen" type="number" inputmode="numeric" min="1" max="14" value="5"></div></div>
      <div class="error" id="introErr"></div>
      <button class="btn" id="introSave" data-t="cStart"></button>
    </div>
    <div id="tracker" class="hidden">
      <div class="seg" style="margin-bottom:14px" id="viewSeg"><button data-view="today" data-t="vToday"></button><button data-view="cal" data-t="vCal"></button><button data-view="an" data-t="vAn"></button></div>
      <div id="vToday" class="card k">
        <div class="chead">
          <div class="cring"><svg viewBox="0 0 118 118"><circle class="tr" cx="59" cy="59" r="50"/><circle class="pr" id="rArc" cx="59" cy="59" r="50"/></svg><b><span id="rDay"></span><small id="rOf"></small></b></div>
          <div><div class="lb" data-t="cDayOf"></div><div class="phn" id="rPhase"></div></div>
        </div>
        <div class="facts" id="rFacts"></div>
        <button class="btn" id="periodBtn" style="margin-top:12px"></button>
      </div>
      <div id="vCal" class="card k">
        <div class="cal-head"><button class="icon-btn" id="mPrev" aria-label="prev"><svg class="ic"><use href="#i-left"/></svg></button><h2 id="mTitle"></h2><button class="icon-btn" id="mNext" aria-label="next"><svg class="ic"><use href="#i-right"/></svg></button></div>
        <div class="grid" id="mGrid"></div>
        <div class="legend"><span><i class="sw" style="background:var(--rose)"></i><span data-t="lPeriod"></span></span><span><i class="sw" style="box-shadow:inset 0 0 0 1.5px var(--rose-ink)"></i><span data-t="lPred"></span></span><span><i class="sw" style="background:var(--accent-soft)"></i><span data-t="lFert"></span></span><span><i class="sw" style="background:var(--accent)"></i><span data-t="lOvu"></span></span><span><i class="sw" style="background:#c99a3b;border-radius:50%;width:8px;height:8px"></i><span data-t="lLogged"></span></span><span><i class="sw" style="background:#e06b7d;border-radius:50%;width:8px;height:8px"></i><span data-t="lIntim"></span></span></div>
      </div>
      <div id="logCard" class="card k">
        <div class="section-h"><h2 id="logTitle"></h2><span class="muted small" id="logSub"></span></div>
        <div class="lbl" data-t="cMood"></div><div class="chips" id="moodChips"></div>
        <div class="lbl" data-t="cSymptoms"></div><div class="chips" id="sympChips"></div>
        <div class="lbl" data-t="cIntimacy"></div>
        <div class="share-row" id="intimRow" style="border:0;padding:0"><div class="sq r" style="color:#e06b7d"><svg class="ic"><use href="#i-heart"/></svg></div><div class="grow"><b data-t="cIntimacyQ"></b></div><span class="switch rose" id="intimSw"></span></div>
        <div id="protWrap" class="hidden"><label data-t="cProtection"></label><div class="chips" id="protChips"></div></div>
        <div class="lbl" data-t="note"></div><textarea id="logNote" style="min-height:64px" data-tp="optional"></textarea>
        <div class="two" style="margin-top:12px"><button class="btn ghost hidden" id="markStart"></button><button class="btn" id="logSave" data-t="save"></button></div>
        <div class="error" id="logMsg"></div>
      </div>
      <div id="vAn"></div>
    </div>
    <p class="muted small" style="text-align:center;margin:10px 8px" data-t="cDisclaimer"></p>
  </div>

  <!-- Partner's cycle -->
  <div id="theirs" class="hidden">
    <div class="card ringwrap" id="pTopCard">
      <div class="ring" id="pRing"><div><span class="muted small" data-t="cDay"></span><b id="pDay"></b><span class="muted small" id="pOf"></span></div></div>
      <div class="phase-name" id="pPhase"></div>
      <div class="muted" id="pNext"></div>
      <p class="small" id="pTip" style="margin:10px 0 0"></p>
    </div>
    <div class="card hidden" id="pCalCard">
      <div class="cal-head"><button class="icon-btn" id="pPrev" aria-label="prev"><svg class="ic"><use href="#i-left"/></svg></button><h2 id="pTitle"></h2><button class="icon-btn" id="pNextM" aria-label="next"><svg class="ic"><use href="#i-right"/></svg></button></div>
      <div class="grid" id="pGrid"></div>
      <div id="pDayInfo" style="margin-top:12px"></div>
    </div>
    <div id="pAn"></div>
  </div>
</main>

<dialog id="shareSheet"><form class="sheet" method="dialog">
  <h2 id="shTitle"></h2>
  <p class="muted small" data-t="shOnlyYou" style="margin:2px 0 8px"></p>
  <div id="shareOpts"></div>
  <div class="preview" id="shPreview"></div>
  <div class="lbl" style="margin-top:18px" data-t="cDefaults"></div>
  <div class="two"><div><label style="margin-top:0" data-t="cCycleLen"></label><input id="setLen" type="number" inputmode="numeric" min="18" max="60"></div><div><label style="margin-top:0" data-t="cPeriodLen"></label><input id="setPlen" type="number" inputmode="numeric" min="1" max="14"></div></div>
  <p class="muted small" data-t="cLenHint"></p>
  <div class="actions"><button class="btn" value="ok" data-t="done"></button></div>
</form></dialog>

<script async src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="common.js?v=14"></script>
<script>
addT({
ru: { cTitle:'Цикл', cMine:'Мой цикл', cIntroTitle:'Отслеживание цикла', cIntroText:'Отметьте, когда начались последние месячные. Дальше приложение посчитает средний цикл и покажет прогноз. По умолчанию данные видите только вы.',

const C = { view: pref('cycleView', 'today'), histAll:false, pstats:null, plogs:{}, psel:null, intim:false, getProt:null, ctx:null, who:'me', status:null, pstatus:null, periods:[], ppriods:[], logs:{}, settings:null, month:null, pmonth:null, sel:null, getMood:null, getSymp:null };

async function load(){
  const me = C.ctx.user.id, partner = C.ctx.partner;
  const [st, per, logs, set, pst] = await Promise.all([
    sb.rpc('cycle_status'),
    sb.from('cycle_periods').select('*').order('start_date', { ascending:false }).limit(60),
    sb.from('cycle_logs').select('*').eq('user_id', me).gte('log_date', ymd(addDays(today(), -400))),
    sb.from('cycle_settings').select('*').eq('user_id', me).maybeSingle(),
    partner ? sb.rpc('cycle_status', { p_user: partner.id }) : Promise.resolve({ data:null })
  ]);
  C.status = st.data; C.pstatus = pst.data; C.settings = set.data;
  C.periods = (per.data || []).filter(p => p.user_id === me);
  C.ppriods = (per.data || []).filter(p => p.user_id !== me);
  C.logs = Object.fromEntries((logs.data || []).map(l => [l.log_date, l]));
  C.plogs = {};
  if (partner && C.pstatus) {
    const { data: pl } = await sb.rpc('cycle_partner_logs', { p_user: partner.id, p_from: ymd(addDays(today(), -400)), p_to: ymd(addDays(today(), 60)) });
    C.plogs = Object.fromEntries((pl || []).map(l => [l.log_date, l]));
    const { data: ps } = await sb.rpc('cycle_partner_stats', { p_user: partner.id });
    C.pstats = ps;
  }
  render();
}

// Day classification for a calendar from periods + forecast
function dayMap(periods, status){
  const m = {};
  const plen = status?.period_length || 5, len = status?.cycle_length || 28;
  for (const p of periods) {
    const s = parseYmd(p.start_date), e = p.end_date ? parseYmd(p.end_date) : addDays(s, plen - 1);
    for (let d = s; d <= e; d = addDays(d, 1)) m[ymd(d)] = 'per';
  }
  if (status?.has_data) {
    const last = parseYmd(status.last_start);
    for (let c = 0; c < 7; c++) {
      const start = addDays(last, len * c), ov = addDays(start, len - 14 - 1);
      for (let i = -4; i <= 1; i++) { const k = ymd(addDays(ov, i)); if (!m[k]) m[k] = i === 0 ? 'ovu' : 'fert'; }
      if (c > 0) for (let i = 0; i < plen; i++) { const k = ymd(addDays(start, i)); if (!m[k] && addDays(start, i) >= today()) m[k] = 'pred'; }
    }
  }
  return m;
}
function drawMonth(gridId, titleId, month, map, withSel, logs){
  $(titleId).textContent = `${t('months')[month.getMonth()]} ${month.getFullYear()}`;
  const first = (month.getDay() + 6) % 7, start = new Date(month.getFullYear(), month.getMonth(), 1 - first), tk = ymd(today());
  let html = t('dow').map(d => `<div class="dow">${d}</div>`).join('');
  for (let i = 0; i < 42; i++) {
    const d = addDays(start, i), k = ymd(d);
    if (i >= 35 && d.getMonth() !== month.getMonth()) break;
    const lg = (logs || {})[k], sel = withSel ? C.sel : C.psel;
    const cls = [d.getMonth() !== month.getMonth() ? 'other' : '', k === tk ? 'today' : '', map[k] || '', k === sel ? 'sel' : '', lg && (lg.mood || (lg.symptoms || []).length || lg.note) ? 'logged' : ''].join(' ');
    html += `<button type="button" class="day ${cls}" data-day="${k}">${d.getDate()}${lg?.intimacy ? '<span class="idot"></span>' : ''}</button>`;
  }
  $(gridId).innerHTML = html;
}
function ringStyle(status){
  const len = status.cycle_length, plen = status.period_length, day = Math.min(status.day, len);
  const ov = status.ovulation_day;
  const pct = x => (x / len * 100).toFixed(1) + '%';
  return `background:conic-gradient(var(--rose) 0 ${pct(plen)}, var(--line) ${pct(plen)} ${pct(ov-5)}, var(--accent-soft) ${pct(ov-5)} ${pct(ov+1)}, var(--line) ${pct(ov+1)} 100%);` +
    `box-shadow:0 0 0 0 transparent;` + `--d:${pct(day)}`;
}
function statusText(s){
  if (s.phase === 'late') return t('lateBy', s.day - s.cycle_length);
  if (s.phase === 'period') return t('periodDay', s.day, s.period_length);
  return t('nextIn', dayDiff(today(), parseYmd(s.next_start)));
}
// ===== Analysis =====
const num1 = x => (Math.round(x * 10) / 10).toLocaleString(LANG === 'en' ? 'en-US' : 'ru-RU');
const mean = a => a.reduce((x, y) => x + y, 0) / (a.length || 1);
const sdev = a => { const m = mean(a); return Math.sqrt(mean(a.map(x => (x - m) ** 2))); };
const shortD = d => `${d.getDate()} ${t('monthsShort')[d.getMonth()]}`;
const rangeD = (a, b) => a.getMonth() === b.getMonth() ? `${a.getDate()}–${b.getDate()} ${t('monthsShort')[a.getMonth()]}` : `${shortD(a)} – ${shortD(b)}`;
function myCycles(){
  const ps = C.periods.slice().sort((a, b) => a.start_date.localeCompare(b.start_date)), out = [];
  for (let i = 0; i < ps.length - 1; i++) {
    const s0 = parseYmd(ps[i].start_date), len = dayDiff(s0, parseYmd(ps[i + 1].start_date));
    if (len < 18 || len > 60) continue;
    out.push({ start:s0, len, plen: ps[i].end_date ? dayDiff(s0, parseYmd(ps[i].end_date)) + 1 : null });
  }
  return out;
}
// How wide the forecast window is: depends on how much recent cycles vary
function windowDays(){ const l = myCycles().slice(-12).map(c => c.len); return l.length < 3 ? 2 : Math.min(3, Math.max(1, Math.round(sdev(l)))); }
function factsHTML(s){
  if (s.phase === 'late') {
    return `<div class="r"><b>${t('fLate', s.day - s.cycle_length)}</b>${t('fPeriod')}</div><div><b>${shortD(addDays(parseYmd(s.last_start), s.cycle_length))}</b>${t('fExpectedL')}</div>`;
  }
  if (s.phase === 'period') {
    const end = addDays(parseYmd(s.last_start), (s.period_length || 5) - 1);
    return `<div class="r"><b>${t('fPeriodDay', s.day)}</b>${t('fPeriodNow')}</div><div><b>${shortD(end)}</b>${t('fEndsL')}</div>`;
  }
  const nx = parseYmd(s.next_start), n = dayDiff(today(), nx), w = windowDays();
  return `<div class="r"><b>${t('inDaysF', n)}</b>${t('fPeriod')}</div><div><b>${rangeD(addDays(nx, -w), addDays(nx, w))}</b>${t('fLikely', nx.getDate())}</div>`;
}
function previewText(sh, partner, pName, s){
  if (!partner) return t('pvNoPartner');
  const parts = [];
  if (sh.phase && s?.has_data) parts.push(`«${t('ph')[s.phase]}${s.phase === 'period' || s.phase === 'late' ? '' : ', ' + t('fPeriod') + ' ' + t('inDaysF', dayDiff(today(), parseYmd(s.next_start)))}»`);
  for (const k of ['periods','feelings','intimacy','notes','analysis']) if (sh[k]) parts.push(t('pv')[k]);
  return parts.length ? `<b>${esc(t('pvSees', pName))}</b> ${esc(parts.join(', '))}` : esc(t('pvNothing', pName));
}
function analysisHTML(cyc, o){
  if (cyc.length < 1) return `<div class="card k empty">${t('anNeed')}</div>`;
  const lens = cyc.map(c => c.len), m = mean(lens), sd = sdev(lens), plens = cyc.map(c => c.plen).filter(Boolean);
  const lo = Math.round(m - sd), hi = Math.round(m + sd);
  let h = o.title ? `<div class="lbl" style="margin-top:6px">${esc(o.title)}</div>` : '';
  h += `<div class="an-hero"><div class="sub">${t('anAvg', cyc.length)}${plens.length ? ' · ' + t('anPlen', Math.round(mean(plens))) : ''}</div>
    <div class="row"><div class="big">${num1(m)}<small>${t('daysW', m)}</small></div><div class="rng">${t('anUsual', lo, hi)}</div></div>
    <div class="an-grid"><div><b>${Math.min(...lens)}</b>${t('anMin')}</div><div><b>${Math.max(...lens)}</b>${t('anMax')}</div><div><b>±${num1(sd)}</b>${t('anSd')}</div></div></div>`;
  // bars
  const last = cyc.slice(-12), lmin = Math.min(...last.map(c => c.len), Math.floor(m)) - 2, lmax = Math.max(...last.map(c => c.len), Math.ceil(m)) + 1;
  const H = 96, hy = v => 10 + (v - lmin) / (lmax - lmin) * (H - 10);
  const recent = last.length >= 8 ? last.length - 6 : 0;
  h += `<div class="card k"><div class="section-h"><h2 style="font-size:18px">${t('anLens')}</h2><span class="muted small">${t('anLastN', last.length)}</span></div>
    <div class="bars"><div class="avg" style="bottom:${hy(m) + 14}px"><span>${num1(m)}</span></div>
    ${last.map((c, i) => `<div><i class="${i >= recent ? 'r' : ''}" style="height:${hy(c.len)}px"></i>${c.len}</div>`).join('')}</div>
    ${o.dates ? `<div class="ax"><span>${t('monthsShort')[last[0].start.getMonth()]} ${last[0].start.getFullYear()}</span><span>${t('monthsShort')[last[last.length - 1].start.getMonth()]} ${last[last.length - 1].start.getFullYear()}</span></div>` : ''}`;
  let ins;
  if (cyc.length >= 12) {
    const a6 = mean(lens.slice(-6)), b6 = mean(lens.slice(-12, -6));
    if (a6 - b6 >= 1.5) ins = t('anLonger', num1(a6), num1(b6)); else if (b6 - a6 >= 1.5) ins = t('anShorter', num1(a6), num1(b6));
  }
  if (!ins && cyc.length >= 3) ins = sd <= 3 ? t('anStable', Math.max(1, Math.round(sd * 2))) : t('anVaries');
  if (ins) h += `<div class="ins">${icon('sparkle')}<span>${ins}</span></div>`;
  h += `</div>`;
  // forecast (own data only)
  const s = o.status;
  if (s && s.phase !== 'late') {
    const nx = parseYmd(s.next_start), w = windowDays(), len = s.cycle_length;
    let ov = addDays(parseYmd(s.last_start), len - 15); if (ov < today()) ov = addDays(nx, len - 15);
    h += `<div class="card k"><div class="section-h"><h2 style="font-size:18px">${t('anForecast')}</h2></div>
      <div class="fc"><span class="sq r">${icon('droplet')}</span><div class="grow">${t('anPeriodRange', rangeD(addDays(nx, -w), addDays(nx, w)))}<div>${t('fLikely', nx.getDate())} · ${t('inDaysF', dayDiff(today(), nx))}</div></div></div>
      <div class="fc"><span class="sq g">${icon('leaf')}</span><div class="grow">${t('anOvu', shortD(ov))}<div>${t('anFert', rangeD(addDays(ov, -4), addDays(ov, 1)))}</div></div></div></div>`;
  }
  // history (own data only)
  if (o.dates) {
    const maxL = Math.max(...lens, s ? Math.max(s.day, s.cycle_length) : 0), dflt = s?.period_length || 5;
    const strip = (len, plen, width, cur) => { const ovs = len - 14 - 4; return `<div class="strip" style="width:${width}%"><span class="p" style="width:${plen / len * 100}%"></span><span class="f" style="left:${ovs / len * 100}%;width:${6 / len * 100}%"></span>${cur ? `<span class="now" style="width:${cur}%"></span>` : ''}</div>`; };
    const rows = [];
    if (s) { const len = s.cycle_length; rows.push(`<div class="hist"><span class="d">${shortD(parseYmd(s.last_start))}</span><div class="tr">${strip(len, dflt, len / maxL * 100, Math.max(0, (1 - Math.min(s.day, len) / len) * 100))}</div><b>${t('anNow')}</b></div>`); }

    h += `<div class="card k"><div class="section-h"><h2 style="font-size:18px">${t('anHist')}</h2><span class="muted small">${t('anHistSub')}</span></div>${rows.join('')}
      ${list.length > 5 ? `<button type="button" class="btn link" data-hist style="margin:8px auto 0">${C.histAll ? t('anLess') : t('anAll', list.length)}</button>` : ''}
      ${plens.length ? '' : `<div class="warn">${t('anNoPlen')}</div>`}</div>`;
  }
  return h;
}

      $('pNext').textContent = soon ? t('pmsSoon') + ' · ' + statusText(p) : statusText(p);
      $('pTip').textContent = t('tips')[p.phase] || '';
    } else { $('pPhase').textContent = ''; $('pNext').textContent = pHas ? '' : t('pNoData', pName); $('pTip').textContent = ''; }
    const ps = p.share || {}, pcal = ps.periods || ps.feelings || ps.intimacy || ps.notes;
    $('pTopCard').classList.toggle('hidden', pHas && !p.phase);
    $('pRing').classList.toggle('hidden', !(pHas && p.phase));
    $('pCalCard').classList.toggle('hidden', !pcal);
    if (pcal) {
      if (!C.pmonth) { const d = today(); C.pmonth = new Date(d.getFullYear(), d.getMonth(), 1); }
      if (!C.psel) C.psel = ymd(today());
      drawMonth('pGrid', 'pTitle', C.pmonth, ps.periods ? dayMap(C.ppriods, p.phase ? p : { ...p, has_data:false }) : {}, false, C.plogs);
      const l = C.plogs[C.psel], parts = [];
      if (l?.mood) parts.push(`<span class="badge">${esc((t('moods').find(m => m[0] === l.mood) || [,l.mood])[1])}</span>`);
      (l?.symptoms || []).forEach(x => parts.push(`<span class="badge warm">${esc((t('symptoms').find(m => m[0] === x) || [,x])[1])}</span>`));
      if (l?.intimacy) parts.push(`<span class="badge rose">${t('cIntimacy')}${l.protection ? ' · ' + esc((t('prot').find(m => m[0] === l.protection) || [,''])[1]) : ''}</span>`);
      $('pDayInfo').innerHTML = `<div class="muted small" style="margin-bottom:6px">${fmtDay(parseYmd(C.psel))}</div>` +
        (parts.length || l?.note ? `<div class="chips">${parts.join('')}</div>${l?.note ? `<div class="small" style="margin-top:6px">${esc(l.note)}</div>` : ''}` : `<div class="muted small">${t('pNothingDay')}</div>`);
    }
  }
}
function renderLog(){
  const k = C.sel, d = parseYmd(k), log = C.logs[k];
  $('logTitle').textContent = k === ymd(today()) ? t('logToday') : fmtDay(d);
  const cd = C.status?.has_data ? dayDiff(parseYmd(C.status.last_start), d) + 1 : null;
  $('logSub').textContent = cd > 0 && cd <= 60 ? t('cycleDayN', cd) : (k === ymd(today()) ? fmtDay(d) : '');
  C.getMood = chipPicker($('moodChips'), t('moods'), log?.mood || null);
  C.getSymp = chipPicker($('sympChips'), t('symptoms'), log?.symptoms || [], true);
  if (document.activeElement?.id !== 'logNote') $('logNote').value = log?.note || '';
  C.intim = !!log?.intimacy; $('intimSw').classList.toggle('on', C.intim); $('protWrap').classList.toggle('hidden', !C.intim);
  C.getProt = chipPicker($('protChips'), t('prot'), log?.protection || null);
  const isStart = C.periods.some(p => p.start_date === k);
  $('markStart').classList.toggle('hidden', d > today());
  $('markStart').textContent = isStart ? t('unmarkStart') : t('markStart');
  $('markStart').onclick = () => isStart ? unmarkStart(k) : startPeriod(k);
  $('logMsg').textContent = ''; $('logMsg').classList.remove('ok-text');
}

// ===== Actions =====
async function startPeriod(day){
  const { error } = await sb.from('cycle_periods').upsert({ user_id:C.ctx.user.id, start_date:day }, { onConflict:'user_id,start_date' });
  if (error) return alert(errText(error));
  await load();
}
async function endPeriod(p){ await sb.from('cycle_periods').update({ end_date: ymd(today()) }).eq('id', p.id); await load(); }
async function unmarkStart(day){
  if (!confirm(t('confirmUnmark'))) return;
  await sb.from('cycle_periods').delete().eq('user_id', C.ctx.user.id).eq('start_date', day); await load();
}
$('introSave').onclick = async () => {
  const d = getDate($('introDate'));
  if (!d) return $('introErr').textContent = t('pickDate');
  await saveSettings(+$('introLen').value || 28, +$('introPlen').value || 5);
  await startPeriod(d);
};
async function saveSettings(len, plen, share){
  len = Math.min(60, Math.max(18, len)); plen = Math.min(14, Math.max(1, plen));
  share = share || C.settings?.share || {};
  const level = !Object.values(share).some(Boolean) ? 'none' : (share.feelings || share.intimacy || share.notes || share.periods) ? 'all' : 'phase';
  const { error } = await sb.from('cycle_settings').upsert({ user_id:C.ctx.user.id, cycle_length:len, period_length:plen, share, share_level:level, updated_at:new Date().toISOString() });
  if (error) { alert(errText(error)); return false; }
  return true;
}
$('shareOpts').onclick = async e => {
  const k = e.target.closest('[data-share]')?.dataset.share; if (!k) return;
  const share = { ...(C.settings?.share || {}) }; share[k] = !share[k];
  e.target.closest('[data-share]').querySelector('.switch').classList.toggle('on', share[k]);
  if (await saveSettings(+$('setLen').value || 28, +$('setPlen').value || 5, share)) await load();
};
$('shareBtn').onclick = () => $('shareSheet').showModal();
$('shareSheet').onclose = async () => {
  const len = +$('setLen').value || 28, plen = +$('setPlen').value || 5;
  if (len !== (C.settings?.cycle_length || 28) || plen !== (C.settings?.period_length || 5)) { if (await saveSettings(len, plen)) await load(); }
};
document.querySelectorAll('#viewSeg button').forEach(b => b.onclick = () => { C.view = b.dataset.view; setPref('cycleView', C.view); render(); window.scrollTo(0, 0); });
$('vAn').onclick = e => { if (e.target.closest('[data-hist]')) { C.histAll = !C.histAll; render(); } };
$('intimRow').onclick = () => { C.intim = !C.intim; $('intimSw').classList.toggle('on', C.intim); $('protWrap').classList.toggle('hidden', !C.intim); };
$('logSave').onclick = async () => {
  const row = { user_id:C.ctx.user.id, log_date:C.sel, mood:C.getMood(), symptoms:C.getSymp(), note:$('logNote').value.trim() || null,
    intimacy:C.intim, protection:C.intim ? C.getProt() : null };
  const { error } = await sb.from('cycle_logs').upsert(row);
  if (error) return alert(errText(error));
  C.logs[C.sel] = row; render(); $('logMsg').textContent = t('saved'); $('logMsg').classList.add('ok-text');
};
$('mGrid').onclick = e => { const k = e.target.closest('[data-day]')?.dataset.day; if (!k) return; C.sel = k;
  const d = parseYmd(k); if (d.getMonth() !== C.month.getMonth()) C.month = new Date(d.getFullYear(), d.getMonth(), 1); render(); };
$('mPrev').onclick = () => { C.month = new Date(C.month.getFullYear(), C.month.getMonth() - 1, 1); render(); };
$('mNext').onclick = () => { C.month = new Date(C.month.getFullYear(), C.month.getMonth() + 1, 1); render(); };
$('pGrid').onclick = e => { const k = e.target.closest('[data-day]')?.dataset.day; if (!k) return; C.psel = k;
  const d = parseYmd(k); if (d.getMonth() !== C.pmonth.getMonth()) C.pmonth = new Date(d.getFullYear(), d.getMonth(), 1); render(); };
$('pPrev').onclick = () => { C.pmonth = new Date(C.pmonth.getFullYear(), C.pmonth.getMonth() - 1, 1); render(); };
$('pNextM').onclick = () => { C.pmonth = new Date(C.pmonth.getFullYear(), C.pmonth.getMonth() + 1, 1); render(); };
document.querySelectorAll('#whoSeg button').forEach(b => b.onclick = () => { C.who = b.dataset.who; render(); });

// ===== Start =====
(async () => {
  applyI18n(); setupBack();
  C.ctx = await requireCouple();
  applyI18n();
  await load();
  // Open the partner's view first if I don't track and they share
  if (!C.status?.has_data && C.pstatus?.has_data) { C.who = 'partner'; render(); }
  show('page', ['loading','page']);
})().catch(e => { console.error(e); alert(t('loadErr') + errText(e)); });
langHooks.push(() => { if (C.ctx) render(); });
</script>
</body>
</html>
